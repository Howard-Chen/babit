<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Babit 工具</title>
<style>
  * { box-sizing: border-box; }
  /* 復古儀器風：淺灰機身面板、象牙白方形鍵帽、琥珀／橘色指示鍵、黑色凹陷顯示窗；右側預覽區是深一階的淺灰面板。
     框線加粗與立體感一律用 box-shadow 畫，不改任何元素的大小與位置。 */
  :root {
    --panel:#d6d5cf;      /* 機身灰 */
    --panel2:#cac9c2;     /* 右側預覽區：比左邊深一階 */
    --line:#2c2c2a;       /* 面板框線 */
    --ink:#1d1d1b;        /* 主要文字 */
    --ink2:#5d5c55;       /* 次要文字 */
    --key:#f1efe7;        /* 象牙白鍵帽 */
    --key-line:#8f8b7e;   /* 鍵帽外框 */
    --key-edge:#a9a597;   /* 鍵帽底邊（立體感） */
    --amber:#f2b11e;      /* 執行：黃琥珀鍵（參考圖 BAT） */
    --orange:#f5902a;     /* 燒錄：亮橘鍵（參考圖 ALERT） */
    --orange-line:#a55a10;
    --orange-edge:#b36414;
    --lit:#c2bfb3;        /* 開啟中：卡住的灰鍵（不用顏色，壓下去變深） */
    --lit-line:#7c796e;
    --lit-edge:#8f8c81;
    --lit-ink:var(--ink);
    --lit-tint:#c9c6ba;   /* 選中的範例卡片底色 */
    --window:#121311;     /* 黑色顯示窗 */
    --window-ink:#efece2; /* 顯示窗裡的字 */
    --red:#ff5b4f;        /* 顯示窗裡的錯誤字、拍點紅燈 */
  }
  body { margin:0; height:100vh; display:grid; grid-template-columns:1fr 540px;
         background:var(--panel); color:var(--ink); font-family:system-ui,sans-serif; }
  .left { display:flex; flex-direction:column; padding:20px; gap:12px; min-width:0; }
  h1 { font-size:15px; font-weight:500; margin:0; }
  textarea { flex:1; background:var(--window); color:var(--window-ink); border:1px solid #000;
             border-radius:4px; padding:14px; font-family:Consolas,monospace;
             font-size:14px; line-height:1.5; resize:none; outline:none;
             white-space:pre; tab-size:2; caret-color:var(--amber);
             box-shadow:0 0 0 1px var(--line), inset 0 2px 8px rgba(0,0,0,.7); }
  .bar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  /* 鍵帽：外框、頂部亮邊、底部厚邊都是 box-shadow，按下時往下沉 2px */
  button { --face:var(--key); --kl:var(--key-line); --ke:var(--key-edge);
           color:var(--ink); background:var(--face); border:0; border-radius:4px; padding:10px 24px;
           font-size:15px; font-weight:700; cursor:pointer;
           box-shadow:inset 0 0 0 1px var(--kl), inset 0 2px 0 rgba(255,255,255,.55),
                      0 3px 0 var(--ke), 0 5px 6px rgba(0,0,0,.28); }
  button:active:not(:disabled) { transform:translateY(2px);
           box-shadow:inset 0 0 0 1px var(--kl), 0 1px 0 var(--ke), 0 2px 3px rgba(0,0,0,.28); }
  button:focus-visible { outline:2px solid var(--amber); outline-offset:3px; }
  #run { --face:var(--amber); --kl:#a8780c; --ke:#b5850f; }
  /* 字加一圈深色細邊：黃色的 ⚡ 在橘色鍵上才看得清楚 */
  #flash { --face:var(--orange); --kl:var(--orange-line); --ke:var(--orange-edge);
           text-shadow:0 0 1px rgba(70,30,0,.9), 0 0 1px rgba(70,30,0,.9); }
  .mini { padding:7px 14px; font-size:13px; }
  /* 開啟中（麥克風、測試音、選中的燈板尺寸）：鍵帽壓下、亮燈 */
  .mini.on { --face:var(--lit); --kl:var(--lit-line); --ke:var(--lit-edge); color:var(--lit-ink);
             transform:translateY(2px);
             box-shadow:inset 0 0 0 1px var(--kl), inset 0 2px 4px rgba(0,0,0,.18), 0 1px 0 var(--ke); }
  button:disabled { opacity:.5; cursor:default; }
  #status, #fwstat { font-size:13px; color:var(--ink2); }
  .pill { font-size:12px; color:#8a4b00; }
  #log { max-height:180px; overflow:auto; background:var(--window); border:1px solid #000;
         color:var(--red); border-radius:4px; padding:12px; margin:0; width:100%;
         font-family:Consolas,monospace; font-size:12px; white-space:pre-wrap;
         box-shadow:0 0 0 1px var(--line), inset 0 2px 8px rgba(0,0,0,.7); }
  .right { display:flex; flex-direction:column; align-items:center;
           justify-content:center; gap:14px; background:var(--panel2); padding:16px;
           box-shadow:inset 2px 0 0 #b1afa6; }
  canvas#m { background:var(--window); border-radius:6px;
             box-shadow:0 0 0 2px #1b1c1b, 0 0 0 5px #b8b5ab, 0 0 0 6px #87847a; }
  .hud { font-size:12px; color:var(--ink2); }
  /* 燈條預覽（程式開頭寫 #define STRIP 幾顆＝另一個接口接了一條燈條）：特定檔期才用，所以預設收著，
     只留一顆小小的收合鈕；點開才在燈板預覽下面畫一排燈。程式有用燈條但收著時，鈕的外框變琥珀色提示。
     除錯模式（零件檢查沒有燈條）整塊收起來，畫面留給文字視窗 */
  .stripbox { width:480px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; }
  .right.dbg .stripbox { display:none; }
  .stripbox .mini { padding:4px 10px; font-size:12px; font-weight:500; }
  .stripbox .mini.has:not(.on) { --kl:#a8780c; box-shadow:inset 0 0 0 2px var(--amber), inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 var(--ke), 0 5px 6px rgba(0,0,0,.28); }
  #stripcv { background:var(--window); border-radius:6px; margin:0 0 2px;
             box-shadow:0 0 0 2px #1b1c1b, 0 0 0 5px #b8b5ab, 0 0 0 6px #87847a; }
  #stripcv[hidden], #stripnote[hidden] { display:none; }
  #stripnote { font-size:12px; color:var(--ink2); line-height:1.5; }
  /* 板子上的旋鈕與四顆按鈕（預覽沒有硬體，在這裡操作）：滑桿＝knob.value()，按住＝pressed()，按一下＝clicked()。
     按鈕排成兩排，跟板子一樣：1、2 在上緣，3、4 在下緣。最右邊是蜂鳴器現在的頻率（預覽用電腦的喇叭發聲） */
  .inputs { display:flex; align-items:center; gap:12px; font-size:12px; color:var(--ink2); }
  .inputs[hidden] { display:none; }       /* 除錯模式接著板子時收起來：這一排只管預覽，板子要按板子上的按鈕 */
  .inputs label { display:flex; align-items:center; gap:6px; }
  .inputs input[type=range] { width:130px; accent-color:var(--amber); }
  .inputs #knobv { min-width:3.2em; }
  .inputs .mini { touch-action:none; user-select:none; padding:5px 12px; }
  .inputs .btns { display:grid; grid-template-columns:auto auto; gap:7px 8px; }
  /* 蜂鳴器：顯示現在的頻率，按一下靜音（預覽的聲音是電腦喇叭發的） */
  .inputs #buzzhud { min-width:7.4em; white-space:nowrap; padding:5px 8px; font-variant-numeric:tabular-nums; text-align:left; }
  .inputs #buzzhud.muted { opacity:.7; }
  /* 除錯模式：右邊多一個序列埠的文字視窗（板子或預覽程式用 Serial 印出來的東西）。
     還沒接板子時燈板預覽縮小留在上面（零件檢查的說明講的是燈板上的八塊）；接著板子就收起來，看真的燈板 */
  /* 小螢幕的筆電（1366×768、1280×720）：燈板預覽和文字視窗跟著畫面的高度縮，旋鈕按鈕那一排（和開麥克風之後的音量儀表）
     才不會被擠到畫面下面。--room＝畫面高度扣掉其他固定的部分（說明列、零件清單、旋鈕按鈕、間距；儀表開著再扣掉它），
     燈板預覽拿一半（100–200），剩下的給文字視窗（80–300）；夠高的畫面（約 780 以上）就是原本的 200 和 300。
     281＝上下留白 32＋間距 44＋說明列 34＋零件清單 90＋旋鈕按鈕 65＋餘裕 16；儀表再加 116。
     矮的畫面改成靠上排：1280 寬時左邊那一欄比畫面高，置中的話右邊這一欄會被往下推到畫面外 */
  .right.dbg { --room:calc(100vh - 281px); --cv:clamp(100px, calc(var(--room) * 0.5), 200px); }
  .right.dbg:has(.meter.on) { --room:calc(100vh - 397px); }
  @media (max-height:780px) { .right.dbg { justify-content:flex-start; } }
  .right.dbg canvas#m { width:var(--cv); height:var(--cv); }
  .right.dbg #serialout { height:clamp(80px, calc(var(--room) - var(--cv)), 300px); }
  .serial { width:480px; display:flex; flex-direction:column; gap:8px; }
  .serial[hidden] { display:none; }
  .srow { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink2); }
  .srow #serialstat { flex:1; line-height:1.4; }
  /* 零件清單：除錯模式的「零件檢查」程式每半秒印一行現況，畫成釘在文字視窗上面的一排格子（✓ 過關＝綠、✗ 沒接好＝紅、還沒試＝灰） */
  #checkpanel { display:grid; gap:6px; font-size:12px; color:var(--ink2); }
  #checkpanel[hidden] { display:none; }
  #checkpanel .ctitle { font-size:13px; font-weight:700; color:var(--ink); }
  #checkpanel .chips { display:flex; flex-wrap:wrap; gap:6px; }
  #checkpanel .chip { padding:3px 8px; border-radius:3px; background:var(--key); box-shadow:inset 0 0 0 1px var(--key-line);
                      white-space:nowrap; font-variant-numeric:tabular-nums; }
  #checkpanel .chip.ok { background:#cfe6c2; color:#1f4a12; box-shadow:inset 0 0 0 1px #6b955b; }
  #checkpanel .chip.bad { background:#f2c4be; color:#7a1a12; box-shadow:inset 0 0 0 1px #b1564d; }
  #checkpanel .chip.skip { background:none; box-shadow:inset 0 0 0 1px var(--key-line); opacity:.7; }   /* 不算的項目（預覽沒有傾斜感測器） */
  #checkpanel .cdetail { font-size:11px; opacity:.85; font-variant-numeric:tabular-nums; }                /* 括號裡的細節（旋鈕的原始讀值…） */
  #serialout { height:380px; margin:0; overflow:auto; background:var(--window); color:#d8d3c2; border-radius:6px;
               padding:10px 12px; font:12px/1.55 Consolas,"Microsoft JhengHei",monospace; white-space:pre-wrap;
               box-shadow:0 0 0 2px #1b1c1b, 0 0 0 5px #b8b5ab, 0 0 0 6px #87847a, inset 0 2px 8px rgba(0,0,0,.7); }
  .meter { width:480px; background:var(--window); border-radius:4px; padding:12px; display:none;
           box-shadow:0 0 0 2px #1b1c1b, 0 0 0 5px #b8b5ab, 0 0 0 6px #87847a, inset 0 2px 8px rgba(0,0,0,.7); }
  .meter.on { display:block; }
  .mrow { display:flex; align-items:center; gap:10px; font-size:11px; color:#c9c4b4;
          margin-bottom:8px; }
  .lvl { flex:1; height:6px; background:#2a2b28; border-radius:1px; overflow:hidden; }
  .lvl i { display:block; height:100%; width:0; background:var(--amber); }
  .bands { display:flex; gap:5px; height:56px; align-items:flex-end; }
  .bands div { flex:1; background:var(--amber); border-radius:1px; height:2px; }
  #beat { width:9px; height:9px; border-radius:50%; background:#3b2b29; }
  #beat.hit { background:var(--red); box-shadow:0 0 6px var(--red); }
  /* 範例卡片：縮圖是編譯站跑出來的 sprite（28 格），用 CSS steps() 播放 */
  .gallery { border-top:1px solid var(--line); padding-top:10px; }
  .gtitle { font-size:12px; color:var(--ink2); margin-bottom:8px; }
  .cards { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; }
  /* 卡片只有縮圖和標題（說明放在滑鼠提示），每一組排成兩排：範例多了以後不用一直左右拖（2026-11-24）。
     卡片是 <button>：瀏覽器預設把按鈕內容垂直置中，改成直向 flex，內容一律從頂端排。
     寬 110＝邊框 2＋內距 12＋縮圖 96，縮圖左右留白才對稱（96÷8＝12、96÷16＝6，LED 放大才是整數倍）。 */
  .card { flex:0 0 auto; width:110px; background:var(--key); border:1px solid var(--key-line);
          border-radius:6px; padding:6px; cursor:pointer; text-align:left;
          color:inherit; font:inherit;
          display:flex; flex-direction:column; justify-content:flex-start;
          box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 3px 0 var(--key-edge), 0 5px 6px rgba(0,0,0,.22); }
  .card:hover { border-color:var(--ink2); background:#f8f6ef; }
  .card.on { border-color:var(--lit-line); background:var(--lit-tint); transform:translateY(2px);
             box-shadow:inset 0 2px 4px rgba(0,0,0,.15), 0 1px 0 var(--lit-edge); }   /* 選取：鍵帽壓下、亮燈 */
  /* 格數由縮圖推得（寬 ÷ 高，每格是正方形），存在 --frames；每格 0.1 秒 */
  .card .thumb { --frames:8; width:96px; height:96px; border-radius:3px; background-color:var(--window);
                 background-repeat:no-repeat; background-size:calc(96px * var(--frames)) 96px;
                 image-rendering:pixelated; box-shadow:0 0 0 1px #000;
                 animation:sprite calc(var(--frames) * 0.1s) steps(var(--frames)) infinite; }
  @keyframes sprite { to { background-position:calc(-96px * var(--frames)) 0; } }
  /* 標題一行，太長的用「…」收尾（完整的標題和說明在滑鼠提示） */
  .card .cname { font-size:13px; color:var(--ink); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .gempty { font-size:12px; color:var(--ink2); padding:6px 2px; }
  #artbri { accent-color:var(--orange); }
  /* 燈板尺寸：兩顆並排的鍵，選中的那顆壓下（放在原本「⚙ 硬體設定」的位置） */
  .seg { display:inline-flex; gap:6px; }
  /* 錯誤訊息＋「複製錯誤訊息」鍵 */
  #logwrap { display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  /* 提醒：預覽看起來正常、燒到板子上會出問題的寫法（琥珀色，跟紅色的錯誤分開） */
  #warn { background:#efe0b0; border:1px solid #a8780c; color:#4a3300; border-radius:4px;
          padding:8px 12px; font-size:13px; line-height:1.5; white-space:pre-line; }
  #logwrap[hidden], #warn[hidden] { display:none; }
  /* 範例分組：同一列橫向捲動，每組上面一行分類名，組與組之間一條細線 */
  .group { flex:0 0 auto; display:flex; flex-direction:column; gap:6px; }
  .group + .group { border-left:1px solid var(--key-line); padding-left:10px; }
  .glabel { font-size:11px; color:var(--ink2); }
  .gcards { display:grid; grid-auto-flow:column; grid-template-rows:repeat(2, auto); gap:10px; justify-content:start; }   /* 兩排：由上而下、再往右 */
  /* 標題列：右邊放「複製給 AI 的說明」；範例標題列：右邊放「＋ 新增範例」 */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  /* 標題旁邊的小字：現在是哪個部署目標、哪一版（開發版／離線版／雲端版 · 來源 commit · 日期） */
  .ver { font-size:11px; color:var(--ink2); margin-right:auto; white-space:nowrap; }
  .ver[hidden] { display:none; }
  .gtitle { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  /* 選到「我的範例」的卡片時多出「🗑 刪除」，程式改過再多「💾 存回」（官方範例沒有這兩顆） */
  .gbtns { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
  .gbtns [hidden] { display:none; }
  /* 新增範例：平常收起來，按「＋ 新增範例」才展開（沿用原本硬體設定面板的樣子） */
  #addex.on { --face:var(--lit); --kl:var(--lit-line); --ke:var(--lit-edge); }
  #addpanel { border:1px solid var(--line); border-radius:8px; padding:14px 16px;
              display:grid; gap:10px; font-size:13px; box-shadow:0 0 0 1px var(--line); }
  #addpanel[hidden] { display:none; }
  #addpanel .row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  #addpanel .grp { color:var(--ink2); font-size:12px; }
  #addpanel input { background:var(--window); color:var(--window-ink); border:1px solid #000; border-radius:3px;
                    padding:6px 8px; font:inherit; width:220px; box-shadow:inset 0 1px 3px rgba(0,0,0,.6); }
  #addpanel .note { color:var(--ink2); font-size:12px; }
  #addpanel .err { color:#a3261c; font-size:12px; white-space:pre-line; }
  #addpanel .err[hidden] { display:none; }
</style>
</head>
<body>
<div class="left">
  <div class="top">
    <h1>Babit 工具（貼上 → 預覽 → 燒錄／燈板）</h1>
    <span id="ver" class="ver" hidden title="這個工具頁是哪個部署目標、哪一版"></span>
    <button id="aiguide" class="mini" type="button" title="把寫程式的規則與範例複製起來，貼給你的 AI">📋 複製給 AI 的說明</button>
  </div>
  <textarea id="code" spellcheck="false"></textarea>
  <div class="bar">
    <button id="run">▶ 執行</button>
    <span class="seg" role="group" aria-label="燈板尺寸">
      <button id="sz8" class="mini" type="button" title="8×8 燈板的範例">8×8</button>
      <button id="sz16" class="mini" type="button" title="16×16 燈板的範例">16×16</button>
    </span>
    <button id="flash">⚡ 燒錄到板子</button>
    <button id="mic" class="mini">🎤 開啟麥克風</button>
    <button id="tone" class="mini">🔊 測試音</button>
    <button id="debug" class="mini" type="button" title="載入「零件檢查」程式：燒進板子後把每個零件試一次，燈板上過關的那一塊會變綠；右邊改成顯示板子印出來的文字">🔧 除錯模式</button>
  </div>
  <div id="addpanel" hidden>
    <div class="row">
      <span class="grp">名稱</span>
      <input id="exname" type="text" maxlength="40" placeholder="例如：我的彩虹" autocomplete="off">
      <button id="exsave" class="mini" type="button">存檔</button>
      <button id="excancel" class="mini" type="button">取消</button>
    </div>
    <div class="err" id="exerr" hidden></div>
    <div class="note" id="exnote"></div>
  </div>
  <div class="bar">
    <span id="status">Ctrl+Enter 執行</span>
    <span id="fwstat"></span>
    <span id="artnet" class="pill" hidden></span>
    <label id="artbriw" class="pill" hidden>亮度 <input id="artbri" type="range" min="1" max="100" step="1" style="width:90px;vertical-align:middle"> <span id="artbriv"></span></label>
  </div>
  <div id="warn" hidden></div>
  <div id="logwrap" hidden>
    <pre id="log"></pre>
    <button id="copylog" class="mini" type="button">📋 複製錯誤訊息（貼給 AI）</button>
  </div>
  <div class="gallery" id="gallery" hidden>

<script type="module">
import { ESPLoader, Transport } from "/vendor/esptool-bundle.js";

// 範例清單拿不到時的預設程式（彩虹）：格式跟 examples/ 裡的範例一樣
const defaultCode = (n) => `// 彩虹流動
// @desc 每一格的色相由位置決定，整面彩虹持續流動
#define PANEL ${n}              // 燈板：8（8×8）或 16（16×16）
#include "BatoPixel.h"

void setup() {
  begin();                   // 啟動燈板、麥克風、傾斜感測、旋鈕
}

void loop() {                // 每 1/60 秒執行一次，每次畫出「現在這一格」
  float t = seconds();       // 開機後第幾秒，動畫都用它來算
  for (int y = 0; y < HEIGHT; y++)
    for (int x = 0; x < WIDTH; x++)
      dot(x, y, hsv((x + y) * 20 + t * 100, 255, 255));
  show();                    // 送出這一格，並自動等到下一格的時間
}
`;
const codeEl = document.getElementById("code");
const runBtn = document.getElementById("run");
const flashBtn = document.getElementById("flash");
const micBtn = document.getElementById("mic");
const toneBtn = document.getElementById("tone");
const sz8 = document.getElementById("sz8");
const sz16 = document.getElementById("sz16");
const statusEl = document.getElementById("status");
const fwstatEl = document.getElementById("fwstat");
const warnEl = document.getElementById("warn");
const logWrap = document.getElementById("logwrap");
const logEl = document.getElementById("log");
const hud = document.getElementById("hud");
const meter = document.getElementById("meter");
const lvlbar = document.getElementById("lvlbar");
const beatDot = document.getElementById("beat");
const bandsEl = document.getElementById("bands");
const rateTxt = document.getElementById("ratetxt");
const ctx = document.getElementById("m").getContext("2d");

const state = { mod:null, ptr:0, n:8, t0:0, target:60, interval:1000/60, last:-Infinity,
                frames:0, fpsT:0, fps:0, ticks:0, warn:0, panelWarn:"" };
const fw = { code:null, key:null, pending:null };
// 聲音：ac 為 AudioContext，src 為目前音源（麥克風或測試音），an 為分析節點
// 重新取樣到與板子相同的 16kHz：兩端 bin 解析度一致（15.6Hz），數值才真的可比對。
// 48kHz 下每個 bin 是 46.9Hz，低頻幾乎分不開（100Hz 與 140Hz 會擠在一起）。
const TARGET_RATE = 16000;
const au = { ac:null, an:null, src:null, kind:null, buf:null, rs:null, osc:null, sweep:0 };
window.__bp = state; window.__bpFw = fw; window.__bpAu = au;

// ── 燈板尺寸（8×8／16×16）──────────────────────────────────────────
// 切換＝換一組範例（examples/8x8 或 examples/16x16），不改編輯區裡程式的寫法；
// 程式要編成哪一種燈板由程式開頭的 #define PANEL 決定。選擇記在這台電腦的瀏覽器裡。
const SIZE_KEY = "babit.size";
let size = 8;
try { if (localStorage.getItem(SIZE_KEY) === "16") size = 16; } catch (_) { /* 瀏覽器不給存取就用 8×8 */ }

const setFw = (t) => { fwstatEl.textContent = t; };
const stored = (k) => { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } };
const remember = (k, v) => { try { localStorage.setItem(k, v); } catch (_) { /* 瀏覽器不給存就算了 */ } };

// ── 部署目標 ─────────────────────────────────────────────────────────
// 同一個工具頁給三個目標用（開發版、離線版、雲端版）。開頁先問編譯站自己是哪一個（GET /version），標題旁邊顯示目標與版本。
// 雲端版（整班共用的主機）跟另外兩個不一樣的地方，程式裡都用 CLOUD 標出來：
//   - 自己的範例存在這個瀏覽器裡（browserStore），不存在編譯站
//   - 編輯區的程式自動存一份草稿：重新整理、不小心關掉分頁，再開都還在
//   - 開頁就檢查這個瀏覽器能不能燒錄
//   - 不連這台電腦的 Art-Net 橋（公開的網站去連本機，瀏覽器會跳出權限詢問）
//   - 編譯、匯出、匯入要課堂代碼（編譯站回 401 就問一次，記在瀏覽器裡）
let ver = { target: "dev", label: "", source: null, dirty: null, date: null };
let CLOUD = false;
async function loadVersion() {
  try {
    const v = await (await fetch("/version")).json();
    if (v && typeof v.target === "string") ver = v;
  } catch (_) { /* 問不到（編譯站沒開）：當成不是雲端版，標題旁邊不顯示 */ }
  CLOUD = ver.target === "cloud";
  const el = document.getElementById("ver");
  if (ver.label) {
    el.textContent = [ver.label, ver.source ? ver.source + (ver.dirty ? "＋還沒 commit 的修改" : "") : "", ver.date].filter(Boolean).join(" · ");
    el.hidden = false;
  }
}

// ── 送給編譯站的請求（GET 以外的都走這裡）──────────────────────────────
// 每個請求帶一個代號（這個瀏覽器第一次開頁時隨機產生）：雲端版整班共用編譯站，排隊時每個人各排各的、互不影響。
// 雲端版另外要課堂代碼：編譯站回 401 就問一次，記在瀏覽器裡，再重送。老師給的連結後面帶 #c=代碼 的話，開頁就記起來、不用再問。
const CLIENT_KEY = "babit.client", CODE_KEY = "babit.classCode";
let clientId = stored(CLIENT_KEY);
if (!/^[a-z0-9]{16}$/.test(clientId)) {
  clientId = Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
  remember(CLIENT_KEY, clientId);
}
let classCode = stored(CODE_KEY);
{
  const m = location.hash.match(/^#c=(.+)$/);
  if (m) {
    try { classCode = decodeURIComponent(m[1]).trim(); remember(CODE_KEY, classCode); } catch (_) {}
    history.replaceState(null, "", location.pathname + location.search);   // 代碼不留在網址列（截圖、分享網址時不會帶出去）
  }
}
let codeAsk = null;                    // 同時有好幾個請求被擋下時只問一次
function askClassCode(msg, tried) {
  if (classCode !== tried) return Promise.resolve(true);       // 別的請求已經問到新的代碼了：直接用它重送
  if (!codeAsk) codeAsk = Promise.resolve().then(() => {
    const v = prompt(msg || "請輸入課堂代碼（老師會公布）", "");
    codeAsk = null;
    if (v == null || !v.trim()) return false;
    classCode = v.trim();
    remember(CODE_KEY, classCode);
    return true;
  });
  return codeAsk;
}
async function api(url, opts = {}) {
  for (let tries = 0; ; tries++) {
    const tried = classCode;
    // 標頭只能放英數字與符號：代碼可能是中文，先編碼（編譯站會解回來）
    const headers = Object.assign({ "X-Babit-Client": clientId }, tried ? { "X-Babit-Code": encodeURIComponent(tried) } : {}, opts.headers || {});
    const r = await fetch(url, Object.assign({}, opts, { headers }));
    if (r.status !== 401 || tries >= 2) return r;
    let j = null;
    try { j = await r.clone().json(); } catch (_) {}
    if (!j || !j.needCode || !(await askClassCode(j.error, tried))) return r;
  }
}
const jsonOf = async (r) => { try { return (await r.json()) || {}; } catch (_) { return {}; } };

// ── 錯誤、提醒、複製 ─────────────────────────────────────────────────
function showLog(t) { logEl.textContent = t; logWrap.hidden = false; }
function hideLog() { logWrap.hidden = true; }
// 編譯錯誤：最上面一行說怎麼辦，下面是編譯站整理過的錯誤訊息（學員整段複製貼給 AI）
function showCompileError(log) {
  const w = log.match(/不能用 (\w+)\(\)|用了 (\w+)\(\)：動畫不能停下來等/);   // delay()、delayMicroseconds()、vTaskDelay()…
  const head = w
    ? `程式用了 ${w[1] || w[2]}()。按下面的「複製錯誤訊息」貼給 AI，請它改成用 seconds() 算畫面。`
    : "編譯失敗。按下面的「複製錯誤訊息」貼給 AI，請它照訊息修正。";
  showLog(head + "\n\n" + log);
}
// 提醒：預覽看起來正常、燒到板子上會出問題的寫法（wrapper.cpp 的 BP_WARN_*）
const WARN_TEXT = {
  1: "setup() 裡要呼叫 begin()：沒有它，板子上的燈板、麥克風、傾斜感測都不會啟動（預覽看不出來）。",
  2: "loop() 的最後要呼叫 show()：沒有它，板子上的燈不會亮，聲音與傾斜也不會更新（預覽看不出來）。",
  4: "loop() 裡只能呼叫一次 show()：每次 loop() 畫一格就好，有先後順序的動畫用 seconds() 算現在在哪一段。",
  8: "buzzer.beep() 的長度單位是秒：這支程式給了超過 10 秒（例如寫 200 會響 200 秒）。如果是把毫秒當成秒，請改成小數（200 毫秒＝0.2）。",
};
// 程式的 PANEL 跟目前選的燈板不同：預覽照程式顯示，但燒到選的那片燈板上會不對
function panelWarnText(p) {
  return !p || p === size ? "" :
    `這段程式是 ${p}×${p} 燈板用的（#define PANEL ${p}），現在選的是 ${size}×${size} 燈板。` +
    `燒到 ${size}×${size} 燈板上畫面會不對：請改用 ${size}×${size} 的程式，或請 AI 把它改成 #define PANEL ${size}。`;
}
function renderWarn() {
  const lines = [];
  if (state.browserWarn) lines.push(state.browserWarn);   // 雲端版：這個瀏覽器不能燒錄（開頁時檢查）
  if (state.panelWarn) lines.push(state.panelWarn);
  for (const bit of [1, 2, 4, 8]) if (state.warn & bit) lines.push(WARN_TEXT[bit]);
  warnEl.textContent = lines.map((l) => "⚠ " + l).join("\n");
  warnEl.hidden = !lines.length;
}
// 預覽中止（函式庫偵測到卡住，或執行時出錯）的原因
const STUCK = {
  "babit-stuck-1": "預覽停住了：loop() 裡有一直在等時間的迴圈（例如 while (millis() - t0 < 500)）。\n動畫請用 seconds() 算出這一格該畫什麼，不要用迴圈等。",
  "babit-stuck-2": "預覽停住了：loop() 裡一直呼叫 show()（例如寫在 while 或 for 迴圈裡）。\n每次 loop() 只畫一格，最後呼叫一次 show()。",
  "babit-stuck-3": "預覽停住了：loop() 裡有一直在等聲音、傾斜、按鈕或蜂鳴器的迴圈（例如 while (!audio.beat())、while (!button1.clicked())、while (buzzer.playing())）。\n同一格裡聲音、傾斜、按鈕、蜂鳴器都不會變：每一格檢查一次就好，用變數記住現在的狀態。",
};
function stopPreview(e) {
  state.mod = null;
  const msg = String((e && e.message) || e);
  const key = Object.keys(STUCK).find((k) => msg.includes(k));
  statusEl.textContent = "✗ 預覽停止";
  showLog(key ? STUCK[key]
              : "預覽執行時出錯（" + msg + "）。\n常見原因：陣列的索引超出範圍、除以 0。把這段訊息和程式一起貼給 AI 檢查。");
}
// 複製文字：先用剪貼簿 API，不行（權限、非安全環境）就用隱藏的 textarea；最後複製的內容放在 window.__bpCopied（測試用）
async function copyText(text) {
  window.__bpCopied = text;
  try { await navigator.clipboard.writeText(text); return; } catch (_) { /* 改用下面的舊方法 */ }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  ta.remove();
}

// 頻段儀表：條數跟著程式的頻段數（8×8 是 8 段、16×16 是 16 段）
let barEls = [];
function syncBars(n) {
  if (barEls.length === n) return;
  bandsEl.replaceChildren(...Array.from({ length: n }, () => document.createElement("div")));
  barEls = Array.from(bandsEl.children);
}
syncBars(8);

// ── 聲音來源 ─────────────────────────────────────────────
// 板子上是 INMP441 經 I²S 送來原始波形；這裡用筆電麥克風產生同一種資料，
// 再交給 WASM 裡「與板子共用」的分析器算 level／band／beat。
async function ensureCtx() {
  if (!au.ac) {
    au.ac = new (window.AudioContext || window.webkitAudioContext)();
    au.an = au.ac.createAnalyser();
    au.an.fftSize = 4096;          // 48kHz 下約 85ms，重新取樣後足夠填滿 1024 筆
    au.buf = new Float32Array(au.an.fftSize);
    au.rs = new Float32Array(au.an.fftSize);   // 重新取樣後的暫存
  }
  if (au.ac.state === "suspended") await au.ac.resume();
  return au.ac;
}
function disconnectSrc() {
  if (au.osc) { try { au.osc.stop(); } catch (_) {} au.osc = null; }
  if (au.src) { try { au.src.disconnect(); } catch (_) {} au.src = null; }
  au.kind = null;
  micBtn.classList.remove("on"); toneBtn.classList.remove("on");
}
async function useMic() {
  if (au.kind === "mic") { disconnectSrc(); meter.classList.remove("on"); return; }
  try {
    const ac = await ensureCtx();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
    disconnectSrc();
    au.src = ac.createMediaStreamSource(stream);
    au.src.connect(au.an);
    au.kind = "mic";
    micBtn.classList.add("on");
    meter.classList.add("on");
    if (state.mod) state.mod._bp_audio_set_rate(TARGET_RATE);
    rateTxt.textContent = Math.round(ac.sampleRate/1000) + "→" + (TARGET_RATE/1000) + "kHz";
  } catch (e) {
    showLog("無法開啟麥克風：" + (e.message || e) + "\n（瀏覽器需要你按下允許）");
  }
}
// 測試音：60Hz→8kHz 緩慢掃頻，用來確認頻段對應正確（低音在左、高音在右）
async function useTone() {
  if (au.kind === "tone") { disconnectSrc(); meter.classList.remove("on"); return; }
  const ac = await ensureCtx();
  disconnectSrc();
  au.osc = ac.createOscillator();
  const g = ac.createGain();
  g.gain.value = 0.25;
  au.osc.type = "sine";
  au.osc.frequency.value = 60;
  au.osc.connect(g); g.connect(au.an);   // 只接分析器，不接喇叭
  au.osc.start();
  au.kind = "tone"; au.sweep = 0;
  toneBtn.classList.add("on");
  meter.classList.add("on");
  if (state.mod) state.mod._bp_audio_set_rate(TARGET_RATE);
  rateTxt.textContent = Math.round(ac.sampleRate/1000) + "→" + (TARGET_RATE/1000) + "kHz";
}
// 每格畫面把最新的時域取樣搬進 WASM
function pumpAudio() {
  if (!au.kind || !state.mod) return;
  if (au.kind === "tone" && au.osc) {
    au.sweep = (au.sweep + 0.0032) % 1;                       // 約 5 秒掃完
    au.osc.frequency.value = 60 * Math.pow(7500/60, au.sweep); // 對數掃頻（上限對齊最高頻段）
  }
  au.an.getFloatTimeDomainData(au.buf);
  // 線性內插重新取樣到 16kHz（輸入取樣率隨裝置不同，44.1k 也能處理）
  const ratio = au.ac.sampleRate / TARGET_RATE;
  const outN = Math.floor((au.buf.length - 1) / ratio);
  for (let i = 0; i < outN; i++) {
    const src = i * ratio, i0 = src | 0, f = src - i0;
    au.rs[i] = au.buf[i0] + (au.buf[i0 + 1] - au.buf[i0]) * f;
  }
  const cap = state.mod._bp_audio_capacity();
  const n = Math.min(outN, cap);
  const p = state.mod._bp_audio_buffer();
  state.mod.HEAPF32.set(au.rs.subarray(outN - n, outN), p >> 2);
  state.mod._bp_audio_commit(n);
}
function drawMeter() {
  if (!au.kind || !state.mod) return;
  lvlbar.style.width = (state.mod._bp_audio_level() * 100) + "%";
  beatDot.className = state.mod._bp_audio_beat() ? "hit" : "";
  syncBars(state.mod._bp_audio_bands());
  for (let i = 0; i < barEls.length; i++)
    barEls[i].style.height = Math.max(2, state.mod._bp_audio_band(i) * 56) + "px";
}

// ── Art-Net 燈板（可選的本地模式）─────────────────────────────
// 瀏覽器不能送 UDP，由本機的橋（bridge/run_bridge.ps1）代送。偵測不到橋時
// 靜默停用、每 3 秒重試，不影響預覽與燒錄。位址必須寫 127.0.0.1——
// Chrome 只把 127.0.0.1／::1 視為可信任 loopback，寫 localhost 會被 mixed content 擋。
// 送出的是與預覽完全相同的 8×8 RGB 畫面（192 bytes）；放大、燈序、顏色順序全在橋端。
const art = { ws:null, ok:false, retry:null };
const artPill = document.getElementById("artnet");
const artBriW = document.getElementById("artbriw"), artBri = document.getElementById("artbri"), artBriV = document.getElementById("artbriv");
function artnetConnect() {
  try { art.ws = new WebSocket("ws://127.0.0.1:8940"); } catch (_) { return artnetRetry(); }
  art.ws.binaryType = "arraybuffer";
  art.ws.onopen = () => { art.ok = true; art.briTouched = false; artPill.hidden = false; artBriW.hidden = false; artPill.textContent = "燈板：已連線"; };
  art.ws.onmessage = (e) => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === "status") {
        const amp = m.ma != null ? ` · 約 ${(m.ma / 1000).toFixed(1)} A` + (m.maxMa && m.maRaw > m.maxMa ? `（原 ${(m.maRaw / 1000).toFixed(1)} A，已壓到上限）` : "") : "";
        artPill.textContent = `燈板 ${m.target}：${m.fps} fps` + amp + (m.test ? `（測試：${m.test}）` : "");

    } catch (_) {}
  };
  art.ws.onclose = art.ws.onerror = () => {
    if (art.ok) artPill.textContent = "燈板：已斷線，重試中…";

}
function artnetRetry() { clearTimeout(art.retry); art.retry = setTimeout(artnetConnect, 3000); }
function artnetSend(fb) {
  // bufferedAmount 是背壓保險：橋若變慢，寧可丟幀也不讓佇列堆積造成延遲累積
  if (art.ok && art.ws && art.ws.readyState === 1 && art.ws.bufferedAmount < 2048) art.ws.send(fb);
}
// 亮度拉桿：只改橋的執行期設定（持久值在 bridge/config.json 的 brightness）
artBri.oninput = () => {
  art.briTouched = true; artBriV.textContent = artBri.value + "%";
  if (art.ws && art.ws.readyState === 1) art.ws.send(JSON.stringify({ type: "config", brightness: artBri.value / 100 }));

window.__bpArt = art;         // 開始連線在最下面的開頁流程裡（雲端版不連）

// 畫布固定 480×480，格數跟著編出來的模組（8×8：每格 52、間隔 8；16×16：每格 26、間隔 3）
function gridOf(N) {
  const gap = N <= 8 ? 8 : 3, cell = Math.floor((472 - (N - 1) * gap) / N);
  return { gap, cell, r: Math.max(3, Math.round(cell * 0.2)), pad: (480 - N * cell - (N - 1) * gap) / 2 };
}
// ── 燈條預覽（收合，預設收著）──────────────────────────────────────
// 程式開頭的 #define STRIP 幾顆＝另一個接口接了一條燈條（函式庫的 strip.dot() 那一組）。預覽畫成一直線，一顆一格；
// 一排最多 80 顆（再多每顆不到 6 像素，看不清楚），超過就平均折成幾排。開關狀態記在這台電腦的瀏覽器裡。
const STRIP_KEY = "babit.strip";
const stripBtn = document.getElementById("striptoggle"), stripCv = document.getElementById("stripcv"), stripNote = document.getElementById("stripnote");
const stripCtx = stripCv.getContext("2d");
const strip = { open: stored(STRIP_KEY) === "1", n: 0, ptr: 0, port: "", layout: null };
function stripLayout(n) {
  const rows = Math.max(1, Math.ceil(n / 80)), per = Math.ceil(n / rows);
  const pitch = Math.max(1, Math.min(28, Math.floor(480 / per))), gap = pitch >= 12 ? 3 : (pitch >= 7 ? 2 : 1);
  const w = pitch - gap, h = Math.max(w, 14), rowGap = 5, pad = 6;

  return { w, h, r: Math.min(4, Math.round(w * 0.3)), width: 480, height: pad * 2 + rows * h + (rows - 1) * rowGap,

window.__bpStripLayout = stripLayout;   // 測試用：第幾顆畫在哪裡
// 收合鈕的字、燈條畫布與說明要不要出現：換程式、按收合鈕之後呼叫
function stripRender() {
  const info = strip.n ? `${strip.port} 接口・${strip.n} 顆` : "";
  stripBtn.textContent = strip.open ? "▾ 燈條預覽" + (info ? "（" + info + "）" : "")
                                    : "▸ 燈條預覽" + (strip.n ? "・這份程式有 " + strip.n + " 顆燈條（" + strip.port + " 接口）" : "");
  stripBtn.setAttribute("aria-expanded", strip.open ? "true" : "false");
  stripBtn.classList.toggle("on", strip.open);
  stripBtn.classList.toggle("has", strip.n > 0);
  stripCv.hidden = !(strip.open && strip.n > 0);
  stripNote.hidden = !(strip.open && strip.n === 0);
  stripNote.textContent = stripNote.hidden ? "" : "這份程式沒有用燈條。要用的話在程式開頭、#include 的前面加一行 #define STRIP 60（60 是燈條有幾顆燈），再用 strip.fill(顏色)、strip.dot(第幾顆, 顏色) 畫。";
  if (!stripCv.hidden) {
    strip.layout = stripLayout(strip.n);
    if (stripCv.height !== strip.layout.height) stripCv.height = strip.layout.height;
  }
}
// 新的預覽模組開始跑：問它有沒有燈條、幾顆、接在哪個接口（GPIO2＝A、GPIO3＝B）
function stripAttach(mod) {
  strip.n = mod && mod._bp_strip_count ? mod._bp_strip_count() : 0;      // 舊的預覽模組沒有這個函式：當成沒有燈條
  strip.ptr = strip.n ? mod._bp_strip_buffer() : 0;
  strip.port = strip.n ? (mod._bp_strip_pin() === 3 ? "B" : "A") : "";
  stripRender();
}
// 每一格：展開著而且程式有燈條才畫。亮度跟燈板的預覽同一個算法（strip.brightness() 調低就變暗，預設亮度＝原本的樣子）
function stripDraw(mod) {
  if (!strip.open || !strip.n || !strip.layout) return;
  const L = strip.layout, buf = mod.HEAPU8.subarray(strip.ptr, strip.ptr + strip.n * 3);
  const gain = Math.min(1, mod._bp_strip_brightness() / mod._bp_brightness_default());
  stripCtx.clearRect(0, 0, stripCv.width, stripCv.height);
  for (let i = 0; i < strip.n; i++) {
    const p = L.at(i), k = i * 3;
    stripCtx.fillStyle = `rgb(${Math.round(buf[k]*gain)},${Math.round(buf[k+1]*gain)},${Math.round(buf[k+2]*gain)})`;
    stripCtx.beginPath();
    stripCtx.roundRect(p.x, p.y, L.w, L.h, L.r);

}
stripBtn.addEventListener("click", () => {
  strip.open = !strip.open;
  try { if (strip.open) localStorage.setItem(STRIP_KEY, "1"); else localStorage.removeItem(STRIP_KEY); } catch (_) { /* 瀏覽器不給存：這次開頁有效就好 */ }
  stripRender();
});
stripRender();

// 旋鈕與按鈕（預覽沒有硬體）：滑桿＝knob.value()；按住按鈕＝pressed()。按下時另外記一筆，
// 就算按得比一格還快（不到 1/60 秒就放開），下一格也會算成「按了一下」（clicked()）
const knobEl = document.getElementById("knob"), knobV = document.getElementById("knobv");
const input = { down:[false, false, false, false], latch:[false, false, false, false] };
knobEl.addEventListener("input", () => { knobV.textContent = knobEl.value + "%"; });
["btn1", "btn2", "btn3", "btn4"].forEach((id, i) => {
  const b = document.getElementById(id);
  const release = () => { input.down[i] = false; };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); input.down[i] = true; input.latch[i] = true; });
  b.addEventListener("pointerup", release);
  b.addEventListener("pointerleave", release);
  b.addEventListener("pointercancel", release);
  b.addEventListener("click", (e) => { if (e.detail === 0) input.latch[i] = true; });   // 用鍵盤按（Tab 到按鈕、按空白鍵）
});
window.__bpInput = input;   // 測試用

// ── 蜂鳴器（預覽沒有硬體，用電腦的喇叭發聲）───────────────────────────
// 程式叫蜂鳴器響的頻率每格讀一次（bp_buzzer_hz）：方波、音量開很小（板子上那顆也不大聲），畫面上同時顯示頻率。
// 顯示頻率的那一顆就是靜音鍵：課堂上十幾台電腦一起響會很吵。靜音只管預覽（電腦的喇叭），板子上的蜂鳴器不受影響；
// 選擇記在瀏覽器裡，重新整理後還是一樣。
//   hz ＝程式現在要它響的頻率（畫面上顯示的，靜音時照樣顯示：學員看得出程式有在叫它響）
//   out＝真的送到喇叭的頻率：靜音、使用者還沒點過頁面（瀏覽器規定點過才能出聲）、分頁收起來（畫面不再更新，沒人會去停它）時是 0
const BUZZ_VOLUME = 0.04;
const BUZZ_MUTE_KEY = "babit-buzz-muted";
const buzz = { hz: 0, out: 0, ac: null, osc: null, gain: null, gestured: false, muted: false, broken: false };
try { buzz.muted = localStorage.getItem(BUZZ_MUTE_KEY) === "1"; } catch (_) { /* 瀏覽器不給存：每次開頁都是有聲音 */ }
const buzzHud = document.getElementById("buzzhud");
for (const ev of ["pointerdown", "keydown"]) addEventListener(ev, () => { buzz.gestured = true; }, { capture: true });
function buzzerHud() {
  buzzHud.textContent = (buzz.muted ? "🔕 " : "🔔 ") + (buzz.hz ? Math.round(buzz.hz) + " Hz" : buzz.muted ? "靜音" : "聲音");
  buzzHud.classList.toggle("muted", buzz.muted);
  buzzHud.setAttribute("aria-pressed", buzz.muted ? "true" : "false");
}
function buzzerSet(hz) {
  if (!(hz > 0)) hz = 0;
  if (hz !== buzz.hz) { buzz.hz = hz; buzzerHud(); }
  buzzerApply();
}
// 把該出聲的頻率送到喇叭。每一格都會呼叫，跟上一次不一樣才動喇叭：所以點過頁面、取消靜音、切回分頁之後，
// 就算程式要的頻率一直沒變，也會馬上響（以前只在頻率改變時才去開喇叭，一直響同一個音的程式點了頁面也沒聲音）
function buzzerApply() {
  const want = buzz.muted || !buzz.gestured || buzz.broken || document.visibilityState === "hidden" ? 0 : buzz.hz;
  if (want === buzz.out) return;
  try {
    if (!buzz.ac) {
      buzz.ac = new (window.AudioContext || window.webkitAudioContext)();
      buzz.osc = buzz.ac.createOscillator();
      buzz.osc.type = "square";
      buzz.gain = buzz.ac.createGain();
      buzz.gain.gain.value = 0;
      buzz.osc.connect(buzz.gain);
      buzz.gain.connect(buzz.ac.destination);
      buzz.osc.start();
    }
    if (want && buzz.ac.state === "suspended") buzz.ac.resume().catch(() => {});
    const now = buzz.ac.currentTime;
    if (want) buzz.osc.frequency.setValueAtTime(want, now);
    buzz.gain.gain.setTargetAtTime(want ? BUZZ_VOLUME : 0, now, 0.003);   // 3 毫秒淡入淡出，開關時才不會「啪」一聲
    buzz.out = want;
  } catch (_) { buzz.broken = true; buzz.out = 0; }   // 這個瀏覽器不能出聲：畫面上的頻率照樣顯示，之後不再試
}
buzzHud.addEventListener("click", () => {
  buzz.muted = !buzz.muted;
  try { if (buzz.muted) localStorage.setItem(BUZZ_MUTE_KEY, "1"); else localStorage.removeItem(BUZZ_MUTE_KEY); } catch (_) {}
  buzzerHud();
  buzzerApply();
});
document.addEventListener("visibilitychange", buzzerApply);
buzzerHud();
window.__bpBuzz = buzz;     // 測試用

function frame(now) {
  requestAnimationFrame(frame);
  if (!state.mod) { buzzerSet(0); return; }               // 預覽停了（還沒執行、編譯失敗、程式卡住）：不能還在響
  if (now - state.last < state.interval - 1) return;
  state.last = now;
  pumpAudio();
  const t = (now - state.t0) / 1000;
  const held = input.down.map((d, i) => (d || input.latch[i] ? 1 : 0));
  state.mod._bp_input_set(knobEl.value / 100, held[0], held[1], held[2], held[3]);
  input.latch.fill(false);
  try { state.mod._bp_tick(t); } catch (e) { stopPreview(e); return; }
  // 蜂鳴器：程式現在要它響的頻率。這兩種時候預覽不出聲——新的程式編譯失敗（舊的預覽還在跑，一邊看錯誤訊息一邊被吵）、
  // 除錯模式接著板子（看的、聽的都是板子；預覽在背景跑，不能跟板子一起響）
  const hz = state.mod._bp_buzzer_hz();
  buzzerSet(state.failed || (dbg.on && dbg.port) ? 0 : hz);
  state.ticks++;
  if (state.ticks === 10 || state.ticks % 60 === 0) {   // 跑幾格後看有沒有「預覽正常、板子會出問題」的寫法
    const w = state.mod._bp_warn();
    if (w !== state.warn) { state.warn = w; renderWarn(); }
  }
  const N = state.n, g = gridOf(N);
  const fb = state.mod.HEAPU8.subarray(state.ptr, state.ptr + N*N*3);
  // 程式用 brightness() 調低亮度時預覽跟著變暗（預設亮度＝原本的樣子；板子另外乘上電源的亮度上限）
  const gain = Math.min(1, state.mod._bp_brightness() / state.mod._bp_brightness_default());
  ctx.clearRect(0, 0, 480, 480);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = (y*N + x) * 3;
    ctx.fillStyle = `rgb(${Math.round(fb[i]*gain)},${Math.round(fb[i+1]*gain)},${Math.round(fb[i+2]*gain)})`;
    ctx.beginPath();
    ctx.roundRect(g.pad + x*(g.cell+g.gap), g.pad + y*(g.cell+g.gap), g.cell, g.cell, g.r);
    ctx.fill();
  }
  stripDraw(state.mod);
  drawMeter();
  if (N === 8) artnetSend(fb);   // Art-Net 橋目前只收 8×8 畫面（192 bytes）
  state.frames++;
  if (now - state.fpsT > 500) {
    state.fps = Math.round(state.frames*1000/(now - state.fpsT));
    state.frames = 0; state.fpsT = now;
    hud.textContent = `t = ${t.toFixed(1)}s ・ ${state.fps}/${state.target} fps`;
  }
}
requestAnimationFrame(frame);

// 背景預編帶 bg=1：編譯站只留最新的一個在排隊（被取代的回 superseded），連點幾個範例再按燒錄不用等一長串。
// 燒錄時 bg=false：一定會編，不會被取代
function precompileFirmware(code, bg = true) {
  if (fw.code === code && (fw.key || fw.pending)) return fw.pending || Promise.resolve({ ok:true, key:fw.key });
  fw.code = code; fw.key = null;
  setFw("韌體：背景編譯中…");
  fw.pending = api("/compile/firmware" + (bg ? "?bg=1" : ""), { method:"POST", headers:{ "Content-Type":"text/plain; charset=utf-8" }, body:code })
    .then(r => r.json())
    .then(j => {
      if (fw.code !== code) return j;      // 已經換了程式：舊的結果（含被取代的）不動狀態列，也不清掉新請求的 pending
      fw.pending = null;
      if (j.ok) { fw.key = j.key; setFw(`韌體：就緒（${j.cached ? "快取" : (j.ms/1000).toFixed(1)+"s"}，${Math.round(j.size/1024)}KB）`); }
      else if (j.busy || j.needCode) { fw.code = null; setFw(""); }   // 編譯站忙、還沒輸入課堂代碼：不是程式有錯，下次再編
      else setFw(j.superseded ? "" : "韌體：編譯失敗（按⚡看詳情）");
      return j;
    })
    .catch(e => { if (fw.code === code) { fw.pending = null; setFw("韌體：連線失敗"); } return { ok:false, log:String(e) }; });
  return fw.pending;
}

// 每按一次執行（或載入範例）編號加一：連點範例時只有最後一次有用——前面的結果晚回來就丟掉，
// 預覽請求帶 bg=1，編譯站也會把排隊中的舊請求作廢
let runSeq = 0;
async function run() {
  const seq = ++runSeq, code = codeEl.value;
  runBtn.disabled = true;
  hideLog();
  statusEl.textContent = "編譯中…";
  const tStart = performance.now();
  try {
    const r = await api("/compile/preview?bg=1", {
      method: "POST",
      headers: { "Content-Type": "text/plain; charset=utf-8" },
      body: code,
    });
    const j = await r.json();
    if (seq !== runSeq) return;
    const ms = Math.round(performance.now() - tStart);
    if (j.superseded) { statusEl.textContent = "預覽被另一個分頁的編譯取代了，再按一次 ▶ 執行"; return; }
    if (j.needCode) { statusEl.textContent = "要輸入課堂代碼才能執行：再按一次 ▶ 執行"; return; }
    if (j.busy) { statusEl.textContent = (j.error || "編譯站現在很忙") + "（▶ 執行）"; return; }
    if (!j.ok) {
      warnEl.hidden = true;
      state.failed = true;                     // 舊的預覽照樣跑（畫面留著），但蜂鳴器不再出聲
      showCompileError(j.log || "（沒有錯誤訊息）");
      statusEl.textContent = `✗ 編譯失敗（${ms}ms）— 錯誤訊息在下方`;
      return;
    }
    const factory = new Function(j.js + ";return createBatoPixel;")();
    const mod = await factory({ print: previewPrint, printErr: previewPrint });   // 程式的 Serial 輸出（除錯模式顯示在文字視窗）
    if (seq !== runSeq) return;
    state.mod = mod;
    state.failed = false;
    state.code = code;                       // 預覽正在跑的是哪一段程式（測試用來確認連點時只跑最後一個）
    state.ptr = mod._bp_framebuffer();
    state.n = mod._bp_width();
    state.target = mod._bp_fps();
    state.interval = 1000 / state.target;
    state.t0 = performance.now();
    state.last = -Infinity;
    state.ticks = 0; state.warn = 0;
    state.panelWarn = panelWarnText(state.n);
    renderWarn();
    stripAttach(mod);                        // 這份程式有沒有燈條（#define STRIP）
    if (au.ac) mod._bp_audio_set_rate(TARGET_RATE);   // 重編後要重設取樣率
    statusEl.textContent = `✓ 執行中（往返 ${ms}ms）`;
    precompileFirmware(code);
  } catch (e) {
    if (seq === runSeq) statusEl.textContent = CLOUD ? "連線失敗——網路斷了嗎？等一下再按一次 ▶ 執行" : "連線失敗——編譯站（run_station.ps1）有開嗎？";
  } finally {
    if (seq === runSeq) runBtn.disabled = false;
  }
}

const MANUAL_HINT =
`自動進入燒錄模式失敗時的手動步驟：
1. 按住板上 BOOT 鍵 → 點一下 RESET 鍵 → 放開 BOOT
2. 再按一次「⚡ 燒錄到板子」，在跳出的視窗選新的序列埠
3. 燒錄完成後按一下 RESET 讓程式開始跑`;

const panelOfCode = (code) => { const m = code.match(/^[ \t]*#[ \t]*define[ \t]+PANEL[ \t]+(\d+)/m); return m ? Number(m[1]) : null; };

// 燒完讓板子重開、跑新程式：ESP32-S3 內建 USB 看到 RTS=1（DTR=0）就重開，放開 RTS 後正常開機（DTR=0 不會進燒錄模式）。
// 這版 esptool-js 的 hard reset 只放開 RTS、沒有先拉起來，不會重開；Windows 關閉序列埠時剛好會讓板子重開，
// Mac 不會，燒完停在燒錄模式、要按 RESET 才跑（2026-10-31 課堂上學員回報並提供這個做法）。
// 板子一重開 USB 就斷線，後面的訊號送不出去會丟錯，不影響
async function resetBoard(transport) {
  try {
    await transport.setDTR(false);
    await transport.setRTS(true);
    await new Promise((r) => setTimeout(r, 100));
    await transport.setRTS(false);
  } catch (_) {}
}

async function flash() {
  const p = panelOfCode(codeEl.value);
  if (p && p !== size && !confirm(`這段程式是 ${p}×${p} 燈板用的（#define PANEL ${p}），現在選的是 ${size}×${size} 燈板，確定要燒錄嗎？`)) return;
  flashBtn.disabled = true; runBtn.disabled = true;
  hideLog();
  let transport = null, flashed = false;
  try {
    if (!("serial" in navigator)) {
      showLog("這個瀏覽器不支援 Web Serial，請改用 Chrome 或 Edge。");
      return;
    }
    await serialDisconnect();      // 除錯模式正接著板子：先放開序列埠，燒錄才接得上
    setFw("韌體：準備中…");
    // 燒錄前一律問編譯站：頁面開著的時候函式庫可能已經更新，頁面記住的韌體會是舊的（2026-10-14 實際踩到）。
    // 函式庫沒變時編譯站直接回快取，不會重編。
    fw.code = null;
    const j = await precompileFirmware(codeEl.value, false);
    if (!j.ok && (j.busy || j.needCode)) { showLog(j.needCode ? "要輸入課堂代碼才能燒錄：再按一次「⚡ 燒錄到板子」" : (j.error || "編譯站現在很忙") + "（⚡ 燒錄到板子）"); setFw(""); return; }
    if (!j.ok) { showCompileError(j.log || "韌體編譯失敗"); setFw("韌體：編譯失敗"); return; }
    const binResp = await fetch("/firmware/" + j.key);
    if (!binResp.ok) { showLog("韌體下載失敗，請重試"); return; }
    const buf = new Uint8Array(await binResp.arrayBuffer());
    let binStr = "";
    for (let i = 0; i < buf.length; i += 8192)
      binStr += String.fromCharCode.apply(null, buf.subarray(i, i + 8192));

    setFw("請在視窗中選擇板子的序列埠…");
    const port = await navigator.serial.requestPort();
    transport = new Transport(port, true);
    const loader = new ESPLoader({
      transport, baudrate: 921600, romBaudrate: 115200,
      terminal: { clean(){}, writeLine(l){ setFw(String(l).slice(0,80)); }, write(d){} },
    });
    setFw("連線中（與板子握手）…");
    await loader.main();
    setFw("燒錄中 0%");
    await loader.writeFlash({
      fileArray: [{ data: binStr, address: 0x0 }],
      flashSize: "keep", flashMode: "keep", flashFreq: "keep",
      eraseAll: false, compress: true,
      reportProgress: (fi, written, total) => setFw(`燒錄中 ${Math.round(written / total * 100)}%`),
    });
    await resetBoard(transport);
    setFw("✓ 燒錄完成——板子執行中，可拔線帶走");
    flashed = true;
  } catch (e) {
    setFw("✗ 燒錄失敗");
    showLog((e && e.message ? e.message : String(e)) + "\n\n" + MANUAL_HINT);
  } finally {
    if (transport) { try { await transport.disconnect(); } catch (_) {} }
    flashBtn.disabled = false; runBtn.disabled = false;
  }
  if (flashed && dbg.on) serialReconnectAfterFlash();   // 除錯模式：燒完接上板子，看它印出來的數值
}

// （四顆按鈕、旋鈕、麥克風、蜂鳴器、傾斜），試過沒問題變綠；每半秒用 Serial 印一行現況，哪裡沒接好也會印出來。

const serialWrap = document.getElementById("serialwrap"), serialOut = document.getElementById("serialout");
const serialStat = document.getElementById("serialstat"), serialConn = document.getElementById("serialconn");
const checkPanel = document.getElementById("checkpanel");
const dbg = { on:false, port:null, reader:null, piped:null, text:"", partial:"", midline:false, checkTimer:0 };
const SERIAL_KEEP = 30000;           // 文字視窗最多留這麼多字（約 150 行），舊的捲掉
const ESPRESSIF_VID = 0x303A;        // ESP32-S3 內建 USB 序列埠的廠商代碼
const CHECK_PREFIX = "零件檢查 ";     // 零件檢查程式每半秒印的那一行現況的開頭
const CHECK_STALE_MS = 3000;         // 這麼久沒收到新的現況就把零件清單收起來（換了別的程式、板子不印了）

function serialAppend(s) {
  const atBottom = serialOut.scrollTop + serialOut.clientHeight >= serialOut.scrollHeight - 30;
  dbg.text = (dbg.text + s).slice(-SERIAL_KEEP);
  serialOut.textContent = dbg.text;

// ── 零件清單 ──
// 零件檢查程式每半秒印一行現況，例如
//   零件檢查 2/8｜按鈕 1 ✓ 2 … 3 … 4 …｜旋鈕 … 0.42（原始 1720，跳動 9，腳位接好）｜麥克風 … 音量 0.12｜傾斜 ✗ 沒偵測到｜蜂鳴器 ✓
// 這一行不放進文字視窗（半秒一行，會把「哪裡沒接好」的訊息捲走），畫成釘在文字視窗上面的清單：一個零件一格，
// ✓ 過關（綠）、✗ 沒接好（紅）、… 還沒試。看不懂的行（別的程式印的）回傳 null，照樣進文字視窗。
// 每一段：記號前面是零件的名字，後面是現在的讀值或原因；括號裡的是細節（more），沒有記號的是「不算」的項目
function checkParse(line) {
  const m = /^零件檢查 (\d+)\/(\d+)｜(.+)$/.exec(line);
  if (!m) return null;
  const parts = [];
  for (const seg of m[3].split("｜").map((s) => s.trim()).filter(Boolean)) {
    const many = /^(\S+) ((?:\d+ [✓…✗] ?)+)$/.exec(seg);        // 「按鈕 1 ✓ 2 … 3 … 4 …」：一顆一格
    if (many) {
      for (const [, n, mark] of many[2].matchAll(/(\d+) ([✓…✗])/g)) parts.push({ name: many[1] + " " + n, mark, detail: "", more: "", full: many[1] + " " + n + " " + mark });
      continue;
    }
    const at = seg.search(/[✓…✗]/);                               // 「旋鈕 … 0.42（原始…）」「傾斜 ✗ 沒偵測到」
    if (at > 0) {
      const rest = seg.slice(at + 1).trim(), paren = /（(.*)）/.exec(rest);
      parts.push({ name: seg.slice(0, at).trim(), mark: seg[at], detail: rest.replace(/（.*）/, "").trim(), more: paren ? paren[1] : "", full: seg });
    } else parts.push({ name: seg.replace(/（.*$/, ""), mark: "", detail: "", more: "", full: seg });   // 「傾斜（預覽沒有感測器，不算）」
  }
  return parts.length ? { done: Number(m[1]), total: Number(m[2]), parts } : null;
}
function checkRender(c) {
  let title = checkPanel.querySelector(".ctitle"), chips = checkPanel.querySelector(".chips"), more = checkPanel.querySelector(".cdetail");
  if (!title) {
    title = checkPanel.appendChild(document.createElement("div")); title.className = "ctitle";
    chips = checkPanel.appendChild(document.createElement("div")); chips.className = "chips";
    more = checkPanel.appendChild(document.createElement("div")); more.className = "cdetail";
  }
  // 標明是誰的：預覽的 7／7 不代表板子過關，要燒進板子、看到「板子的」才算
  title.textContent = `${dbg.port ? "板子" : "預覽"}的零件檢查：${c.done}／${c.total} 項過關` + (c.total > 0 && c.done >= c.total ? "　★ 全部過關" : "");
  while (chips.children.length > c.parts.length) chips.lastChild.remove();
  c.parts.forEach((p, i) => {          // 格子留著只換內容：滑鼠停在上面看細節時不會一直閃
    const el = chips.children[i] || chips.appendChild(document.createElement("span"));
    el.className = "chip" + (p.mark === "✓" ? " ok" : p.mark === "✗" ? " bad" : p.mark ? "" : " skip");
    el.dataset.name = p.name;
    el.textContent = p.mark ? `${p.mark} ${p.name}${p.detail ? " " + p.detail : ""}` : p.full;
    el.title = p.full;
  });
  // 括號裡的細節（旋鈕的原始讀值、跳動、腳位）放在下面一行小字：查「讀值亂跳」時要一直看著它，滑鼠提示不會跟著更新
  more.textContent = c.parts.filter((p) => p.more).map((p) => `${p.name}：${p.more}`).join("｜");
  more.hidden = !more.textContent;
  checkPanel.hidden = false;
  clearTimeout(dbg.checkTimer);
  dbg.checkTimer = setTimeout(checkHide, CHECK_STALE_MS);
}
function checkHide() {
  clearTimeout(dbg.checkTimer);
  checkPanel.hidden = true;
}
// 板子或預覽印出來的文字先經過這裡：一行一行看，零件檢查的現況畫成清單，其他的照樣進文字視窗。
// 還沒換行的半行：可能是現況那一行的開頭就先留著等它收完；不是的話馬上顯示（學員的程式可能用 Serial.print 不換行）
function serialFeed(s) {
  let out = "", buf = dbg.partial + s;
  dbg.partial = "";
  for (let nl; (nl = buf.indexOf("\n")) >= 0; buf = buf.slice(nl + 1)) {
    const line = buf.slice(0, nl);
    const c = dbg.midline ? null : checkParse(line.replace(/\r$/, ""));
    dbg.midline = false;
    if (c) checkRender(c); else out += line + "\n";
  }
  if (buf) {
    const maybeStatus = !dbg.midline && buf.length < 600 && (CHECK_PREFIX.startsWith(buf) || buf.startsWith(CHECK_PREFIX));
    if (maybeStatus) dbg.partial = buf;
    else { out += buf; dbg.midline = true; }
  }
  if (out) serialAppend(out);
}
function serialFeedReset() { dbg.partial = ""; dbg.midline = false; checkHide(); }
// 預覽程式的 Serial 輸出（emcc 的 stdout）：除錯模式沒接板子時顯示在文字視窗，其他時候照舊印到開發者工具
function previewPrint(s) {
  if (dbg.on && !dbg.port) serialFeed(s + "\n");
  else console.log(s);
}
function serialStatus() {
  // 接著板子時，預覽用的旋鈕、按鈕那一排收起來：畫面上看的是板子，點那一排板子不會有反應
  document.getElementById("inputs").hidden = dbg.on && !!dbg.port;
  // 除錯模式的燈板預覽：還沒接板子時縮小留在上面（零件檢查的說明講的是「燈板上」的八塊，要看得到）；接著板子就收起來（看真的燈板）
  canvasEl.hidden = dbg.on && !!dbg.port;
  canvasEl.parentElement.classList.toggle("dbg", dbg.on);
  serialStat.textContent = dbg.port ? "顯示：板子印出來的文字（要試零件請直接按板子上的按鈕、轉板子上的旋鈕）"
    : "顯示：預覽程式印出來的文字。按「⚡ 燒錄到板子」燒完會自動接上板子；已經燒好的板子按「連線板子」";
  serialConn.textContent = dbg.port ? "中斷" : "連線板子";
  serialConn.disabled = !!dbg.closing;             // 序列埠還在關：等它關好才能再連
}
async function serialOpen(port) {
  await port.open({ baudRate: 115200 });
  dbg.port = port;
  serialStatus();
  serialFeedReset();                 // 從這裡開始看板子印的：預覽那邊的零件清單收起來
  serialAppend("── 接上板子 ──\n");
  const decoder = new TextDecoderStream();
  dbg.piped = port.readable.pipeTo(decoder.writable).catch(() => {});
  const reader = dbg.reader = decoder.readable.getReader();
  (async () => {
    try {
      for (;;) { const { value, done } = await reader.read(); if (done) break; if (value && dbg.port === port) serialFeed(value); }
    } catch (_) {}
    if (dbg.port === port) {         // 不是按「中斷」：板子被拔掉或重開了
      dbg.port = null; dbg.reader = null;
      // 先收清單、丟掉板子收到一半的那一行，再等序列埠關好：關的那段空檔裡預覽會印字，不能跟板子的半行接在一起
      serialFeedReset();
      serialAppend("── 板子斷線了 ──\n");
      serialStatus();
      try { await port.close(); } catch (_) {}
    }
  })();
}
async function serialDisconnect() {
  if (dbg.closing) return dbg.closing;   // 已經在關了：等同一次關完（燒錄前、離開除錯模式時也會走到這裡）
  const port = dbg.port;
  if (!port) return;
  const reader = dbg.reader, piped = dbg.piped;
  dbg.port = null;
  serialFeedReset();                 // 板子的零件清單不再更新了：收起來（接下來看的是預覽印的）
  // 序列埠關好之前「連線板子」先不能按：連點兩下「中斷」的第二下會去開還在關的同一個埠，開不起來就跳出選序列埠的視窗
  dbg.closing = (async () => {
    try { await reader.cancel(); } catch (_) {}
    try { await piped; } catch (_) {}
    try { await port.close(); } catch (_) {}
    if (dbg.reader === reader) dbg.reader = null;
    dbg.closing = null;
    serialStatus();
  })();
  serialStatus();                    // 按鈕、預覽的旋鈕按鈕與燈板馬上換回來，不用等序列埠關完
  return dbg.closing;
}
// 之前允許過的 ESP32 序列埠：不用再跳視窗選
async function grantedBoardPorts() {
  if (!("serial" in navigator)) return [];
  return (await navigator.serial.getPorts()).filter((p) => (p.getInfo().usbVendorId || 0) === ESPRESSIF_VID);
}
async function serialConnectClick() {
  if (dbg.port) { await serialDisconnect(); serialAppend("── 中斷 ──\n"); return; }
  if (!("serial" in navigator)) { serialStat.textContent = "這個瀏覽器不支援 Web Serial，請改用 Chrome 或 Edge。"; return; }
  for (const p of await grantedBoardPorts()) { try { await serialOpen(p); return; } catch (_) {} }
  try { await serialOpen(await navigator.serial.requestPort()); }
  catch (e) { if (!e || e.name !== "NotFoundError") serialStat.textContent = "連線失敗：" + (e && e.message || e); }
}
// 燒錄完板子會重開，USB 序列埠會斷開再出現：等它回來再接（最多約 8 秒）
async function serialReconnectAfterFlash() {
  serialAppend("── 燒錄完成，等板子重開… ──\n");
  for (let i = 0; i < 16 && dbg.on && !dbg.port; i++) {
    await new Promise((ok) => setTimeout(ok, 500));
    for (const p of await grantedBoardPorts()) { try { await serialOpen(p); return; } catch (_) {} }
  }
  if (dbg.on && !dbg.port) serialStat.textContent = "沒有自動接上：按「連線板子」選板子的序列埠";
}
// 把「零件檢查」放進編輯區（還沒執行）。載入失敗回 false
async function loadCheckSketch() {
  let code;
  try {
    const r = await fetch("/debug-sketch");
    if (!r.ok) throw new Error("HTTP " + r.status);
    code = await r.text();
  } catch (e) { statusEl.textContent = "載入零件檢查程式失敗：" + e.message; return false; }
  // 跟著目前的燈板尺寸。原本的程式有寫 #define PORT B（燈板接在 B 接口；舊板子的 C 也算）就一起帶過來：
  // 零件檢查要看燈板上的八塊，接口不對的話燒進去燈板全黑，會以為板子壞了
  const pm = codeEl.value.match(/^[ \t]*#[ \t]*define[ \t]+PORT[ \t]+([A-Ca-c])\b/m);
  const port = pm && pm[1].toUpperCase() !== "A" ? pm[1].toUpperCase() : "";
  const eol = code.includes("\r\n") ? "\r\n" : "\n";
  setCode(code.replace(/^([ \t]*#define[ \t]+PANEL[ \t]+)\d+(.*)$/m, (all, head, tail) => head + size + tail + (port ? eol + "#define PORT " + port : "")), null);
  dbg.code = codeEl.value;           // 編輯區現在是原封不動的零件檢查：切換燈板尺寸時要跟著換成新尺寸的（見 switchSize）
  return true;
}
async function setDebug(on) {
  if (on) {
    // 程式改過時先問：按「取消」保留目前的程式，只把右邊換成文字視窗（看學員自己用 Serial 印的東西）
    const load = !isDirty() || confirm("載入「零件檢查」會蓋掉目前的程式碼，確定嗎？\n" +
      "（按「取消」：保留目前的程式，只把右邊換成文字視窗，看它用 Serial 印出來的東西）");
    if (load && !(await loadCheckSketch())) return;
    dbg.on = true; dbg.text = ""; serialOut.textContent = "";

  }

  serialStatus();                    // 燈板預覽、旋鈕按鈕那一排要不要顯示也在這裡決定
}

// serverStore（開發版、離線版）：編譯站的 examples/<尺寸>/我的範例，就是這台電腦上的資料夾，AI 也可以直接把檔案寫進去。
// browserStore（雲端版）：這個瀏覽器的 IndexedDB。編譯站是整班共用的，不存任何人的東西。
//   換瀏覽器、換電腦、清除網站資料就看不到了——要帶走請按「⬇ 匯出 Arduino 資料夾」，之後可以「⬆ 匯入 zip」放回來。
// 兩個的用法一樣（下面的新增、存回、刪除、匯入、縮圖都只呼叫 store，不管是哪一個）：

  async mine() { return []; },
  saveThumb(ex, canvas) {           // 上傳給編譯站存著；失敗（程式剛好又改了、編譯站關了）不影響這一頁的顯示
    canvas.toBlob((blob) => {
      if (blob) api("/thumb?id=" + encodeURIComponent(ex.id) + "&k=" + ex.thumbKey, { method: "PUT", headers: { "Content-Type": "image/png" }, body: blob }).catch(() => {});
    }, "image/png");
  },
};

// IndexedDB 裡一筆＝{ key: "<尺寸>:<名稱>", size, name, code, updated（存的時間）, thumb（縮圖的 data: 網址）, thumbFor（那張縮圖是哪一次存的程式）}
const IDB_NAME = "babit", IDB_STORE = "examples";
const NO_IDB = "這個瀏覽器不讓網頁存資料（是不是開了無痕視窗？）。範例存不起來：請用一般的視窗開，或按「⬇ 匯出 Arduino 資料夾」把程式存成檔案";
let idbOpening = null;
function idbOpen() {
  if (!idbOpening) idbOpening = new Promise((resolve, reject) => {
    const q = indexedDB.open(IDB_NAME, 1);
    q.onupgradeneeded = () => q.result.createObjectStore(IDB_STORE, { keyPath: "key" });
    q.onsuccess = () => resolve(q.result);
    q.onerror = q.onblocked = () => reject(q.error || new Error("IndexedDB 打不開"));
  });
  return idbOpening;
}
async function idbDo(mode, fn) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, mode), q = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = () => resolve(q ? q.result : undefined);
    tx.onerror = tx.onabort = () => reject(tx.error || new Error("IndexedDB 存取失敗"));
  });
}
const LOCAL = "local:";                                   // 存在瀏覽器裡的範例，id 是 local:<尺寸>:<名稱>（跟編譯站的範例 id 分得開）
const localKey = (ex) => ex.id.slice(LOCAL.length);
const localThumbKey = (rec) => LOCAL + rec.key + ":" + rec.updated;
// 卡片上的說明：檔頭註解裡的 // @desc 一句話（規則跟編譯站 catalog.js 的 exampleMeta 一樣）
function descOf(code) {
  let desc = "";
  for (const line of String(code).split(/\r?\n/)) {
    const m = line.match(/^\s*\/\/\s?(.*)$/);
    if (!m) break;
    const d = m[1].trim().match(/^@desc\s+(.*)$/);
    if (d) desc = d[1].trim();
  }
  return desc;
}
// 名稱能不能用、燈板尺寸對不對，還是問編譯站（跟離線版同一套規則，POST /examples/check 只檢查不存），過了才存進瀏覽器
async function checkExample(size, name, code) {
  const j = await jsonOf(await api("/examples/check", { method: "POST", headers: { "Content-Type": "application/json" },
                                                         body: JSON.stringify({ size, name, code }) }));
  return j.ok ? { ok: true, name: j.name, code: j.code } : { ok: false, error: j.error || "編譯站沒有回應，請再試一次" };
}
const browserStore = {
  async add({ size, name, code, overwrite = false }) {
    const c = await checkExample(size, name, code);
    if (!c.ok) return c;
    const key = size + ":" + c.name;
    try {
      if (!overwrite && await idbDo("readonly", (s) => s.get(key))) return { ok: false, exists: true };
      await idbDo("readwrite", (s) => s.put({ key, size, name: c.name, code: c.code, updated: Date.now(), thumb: null, thumbFor: 0 }));
    } catch (_) { return { ok: false, error: NO_IDB }; }
    return { ok: true, id: LOCAL + key };
  },
  async update(ex, code) {
    let rec;
    try { rec = await idbDo("readonly", (s) => s.get(localKey(ex))); } catch (_) { return { ok: false, error: NO_IDB }; }
    if (!rec) return { ok: false, error: "找不到這個範例（是不是在別的分頁刪掉了？）。要留著請按「＋ 新增範例」再存一次" };
    const c = await checkExample(rec.size, rec.name, code);
    if (!c.ok) return c;
    try { await idbDo("readwrite", (s) => s.put(Object.assign(rec, { code: c.code, updated: Date.now() }))); } catch (_) { return { ok: false, error: NO_IDB }; }
    return { ok: true };
  },
  async remove(ex) {
    try { await idbDo("readwrite", (s) => s.delete(localKey(ex))); } catch (_) { return { ok: false, error: NO_IDB }; }
    return { ok: true };
  },
  async code(ex) {
    if (!ex.local) return serverStore.code(ex);            // 官方範例還是跟編譯站拿
    const rec = await idbDo("readonly", (s) => s.get(localKey(ex)));
    if (!rec) throw new Error("找不到這個範例");
    return rec.code;
  },
  async mine(size) {
    let all;
    try { all = await idbDo("readonly", (s) => s.getAll()); } catch (_) { return []; }
    return all.filter((r) => r.size === size).sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0)).map((r) => ({
      id: LOCAL + r.key, title: r.name.replace(/^\d+[_\s.-]+/, "") || r.name, desc: descOf(r.code), category: "我的範例", mine: true, local: true,
      thumbKey: localThumbKey(r), thumbUrl: r.thumb && r.thumbFor === r.updated ? r.thumb : null }));
  },
  async saveThumb(ex, canvas, url) {                       // 縮圖跟範例存在一起；這期間程式又改過（updated 不同）就不存
    try {
      const rec = await idbDo("readonly", (s) => s.get(localKey(ex)));
      if (rec && localThumbKey(rec) === ex.thumbKey) await idbDo("readwrite", (s) => s.put(Object.assign(rec, { thumb: url, thumbFor: rec.updated })));
    } catch (_) {}
  },
};
let store = serverStore;               // 開頁問到是雲端版就換成 browserStore（見最下面的開頁流程）

async function loadGallery() {
  let list;
  try { list = await (await fetch("/examples?size=" + size)).json(); } catch (_) { list = []; }
  if (!Array.isArray(list)) list = [];
  galleryList = list.concat(await store.mine(size));
  renderGallery();
}

function renderGallery() {
  cardsEl.innerHTML = "";
  galleryEl.hidden = false;
  renderExButtons();
  if (!galleryList.length) {
    const p = document.createElement("div");
    p.className = "gempty";
    p.textContent = `${size}×${size} 燈板還沒有範例`;
    cardsEl.appendChild(p);
    return;
  }
  let row = null, cat = null;
  for (const ex of galleryList) {
    if (!row || ex.category !== cat) {                  // 分類換了：開新的一組
      cat = ex.category;
      const g = document.createElement("div");
      g.className = "group";
      const lb = document.createElement("div");
      lb.className = "glabel";
      lb.textContent = cat || "其他";
      row = document.createElement("div");
      row.className = "gcards";
      g.append(lb, row);
      cardsEl.appendChild(g);
    }
    row.appendChild(makeCard(ex));
  }
}

function makeCard(ex) {
  const b = document.createElement("button");
  b.className = "card" + (ex.id === currentId ? " on" : "");
  b.type = "button";
  b.dataset.id = ex.id;
  const th = document.createElement("div");
  th.className = "thumb";
  const show = (src, frames) => {
    th.style.backgroundImage = "url(" + src + ")";
    th.style.setProperty("--frames", frames);
  };
  if (ex.thumbKey && thumbMade.get(ex.thumbKey)) show(thumbMade.get(ex.thumbKey), THUMB_FRAMES);    // 這一頁剛算過的直接用
  else if (ex.thumbUrl) show(ex.thumbUrl, THUMB_FRAMES);                                            // 存在瀏覽器裡的範例：縮圖跟它存在一起
  else if (ex.local) queueThumb(ex).then((url) => { if (url) show(url, THUMB_FRAMES); });           // 還沒算過：在這裡算
  else if (ex.thumb) {
    // 讀圖的寬高推出格數（每格正方形），不必在清單裡另外標。網址帶上 thumbKey：程式改了就是另一張圖
    const src = ex.thumb + (ex.thumbKey ? "&k=" + ex.thumbKey : "");
    const im = new Image();
    im.onload = () => show(src, Math.max(1, Math.round(im.naturalWidth / im.naturalHeight)));
    // 編譯站沒有這張圖（自己的範例還沒算過縮圖）：在這裡算。算不出來（程式有錯、卡住）就留黑底
    im.onerror = () => { if (ex.thumbKey) queueThumb(ex).then((url) => { if (url) show(url, THUMB_FRAMES); }); };
    im.src = src;
  }
  const nm = document.createElement("div");
  nm.className = "cname";
  nm.textContent = ex.title;
  b.title = ex.title + (ex.desc ? "\n" + ex.desc : "");   // 卡片上只放標題：說明（程式檔頭的 @desc）滑鼠移上去才看得到
  b.append(th, nm);
  b.addEventListener("click", () => pickExample(ex));
  return b;
}

// ── 自己的範例的縮圖：工具頁自己算 ─────────────────────────────────
// 編譯站不執行學員的程式：程式可以夾帶 JavaScript（別人給的 zip、網路上抄來的都可能有），在編譯站跑等於讓它在這台電腦上
// 執行任意指令。所以沒有官方縮圖的範例由這裡算：請編譯站編譯 → 在沙箱裡把預覽跑一遍、取 28 格（取法跟 station/thumb.js 一樣）
// → 排成一張圖顯示，並上傳給編譯站存著（下次開頁直接用）。
// 沙箱＝sandbox 的 iframe（不給 allow-same-origin：碰不到這個頁面，它送出的請求編譯站也不收）裡再開一個 Worker
// （程式卡死時整個停掉，不會卡住頁面）。沙箱傳回來的東西只當成像素用，格式不對就丟掉。
const THUMB_FRAMES = 28, THUMB_LOOP = 2.8, THUMB_FPS = 60, THUMB_TIMEOUT = 5000;
const THUMB_WORKER_SRC = `
onmessage = async (e) => {
  const { js, loop, FRAMES, FPS } = e.data;
  try {
    const create = new Function(js + "\\nreturn createBatoPixel;")();
    const m = await create({ print() {}, printErr() {} });
    const N = m._bp_width(), ptr = m._bp_framebuffer(), bytes = N * N * 3;
    const at = Array.from({ length: FRAMES + 1 }, (_, k) => Math.round((2 + k / FRAMES) * loop * FPS) + 1);
    const shots = [];
    for (let i = 0, next = 0; next < at.length; i++) {
      m._bp_tick(i / FPS);
      if (i === at[next]) { shots.push(m.HEAPU8.slice(ptr, ptr + bytes)); next++; }
    }
    shots.pop();
    postMessage({ ok: true, N, shots }, shots.map((s) => s.buffer));
  } catch (err) { postMessage({ ok: false }); }
};`;
const THUMB_FRAME_SRC = `<!doctype html><script>
const SRC = ${JSON.stringify(THUMB_WORKER_SRC)};
addEventListener("message", (e) => {
  if (e.source !== parent) return;
  const w = new Worker(URL.createObjectURL(new Blob([SRC], { type: "text/javascript" })));
  let over = false;
  const done = (msg) => { if (over) return; over = true; clearTimeout(t); w.terminate(); parent.postMessage(Object.assign({ id: e.data.id }, msg), "*"); };
  const t = setTimeout(() => done({ ok: false }), e.data.timeout);
  w.onmessage = (m) => done(m.data);
  w.onerror = () => done({ ok: false });
  w.postMessage(e.data);
});
parent.postMessage({ ready: true }, "*");
<\/script>`;
const thumbMade = new Map();           // thumbKey → 算好的圖（data: 網址）
// 確定算不出來的（程式編不過、卡住、畫面格式不對）記在瀏覽器裡：之後開頁不再自動重跑那份程式。
// 鑰匙跟著程式內容變，程式改了自然會再試一次。一時的問題（編譯站沒回應）不記
const THUMB_FAIL_KEY = "babit.thumbFail";
const thumbFailed = new Set();
try { for (const k of JSON.parse(localStorage.getItem(THUMB_FAIL_KEY) || "[]").slice(-300)) if (typeof k === "string") thumbFailed.add(k); } catch (_) {}
function rememberThumbFail(key) {
  thumbFailed.add(key);
  try { localStorage.setItem(THUMB_FAIL_KEY, JSON.stringify([...thumbFailed].slice(-300))); } catch (_) {}
}
const thumbJobs = new Map();           // thumbKey → 進行中的工作
const thumbWaiting = new Map();        // 送進沙箱的工作編號 → 等結果的人
let thumbBox = null, thumbBoxReady = null, thumbSeq = 0, thumbChain = Promise.resolve();

function thumbSandbox() {
  if (!thumbBoxReady) thumbBoxReady = new Promise((resolve) => {
    thumbBox = document.createElement("iframe");
    thumbBox.setAttribute("sandbox", "allow-scripts");
    thumbBox.style.display = "none";
    thumbBox.srcdoc = THUMB_FRAME_SRC;
    addEventListener("message", (e) => {
      if (e.source !== thumbBox.contentWindow || !e.data) return;
      if (e.data.ready) { resolve(); return; }
      const wait = thumbWaiting.get(e.data.id);
      if (wait) { thumbWaiting.delete(e.data.id); wait(e.data); }
    });
    document.body.appendChild(thumbBox);
  });
  return thumbBoxReady;
}

// 一次算一張（照卡片出現的順序）。回傳 data: 網址；沒有圖就回 null（確定算不出來）或 undefined（這次沒算成，下次再試）
function queueThumb(ex) {
  const key = ex.thumbKey;
  if (thumbMade.has(key)) return Promise.resolve(thumbMade.get(key));
  if (thumbFailed.has(key)) return Promise.resolve(null);
  if (!thumbJobs.has(key)) {
    const job = thumbChain.then(() => makeThumb(ex)).catch(() => undefined).then((url) => {
      if (url) thumbMade.set(key, url);
      else if (url === null) rememberThumbFail(key);
      thumbJobs.delete(key);
      return url;
    });
    thumbChain = job;
    thumbJobs.set(key, job);
  }
  return thumbJobs.get(key);
}

async function makeThumb(ex) {
  let code;
  try { code = await store.code(ex); } catch (_) { return undefined; }
  // 不帶 bg：照順序編，不會被學員按執行的預覽擠掉（thumb=1 只是標明用途，編譯站不看）
  const r = await (await api("/compile/preview?thumb=1", { method: "POST", headers: { "Content-Type": "text/plain; charset=utf-8" }, body: code })).json();
  if (!r.ok) return r.log ? null : undefined;          // 有編譯訊息＝程式編不過（確定算不出來）；其他（編譯站忙、還沒輸入課堂代碼）下次再試
  const loop = parseFloat((code.match(/^\s*\/\/\s*@loop\s+([\d.]+)/m) || [])[1]) || THUMB_LOOP;
  await thumbSandbox();
  const id = ++thumbSeq;
  const out = await new Promise((resolve) => {
    thumbWaiting.set(id, resolve);
    setTimeout(() => { if (thumbWaiting.delete(id)) resolve(null); }, THUMB_TIMEOUT + 3000);      // 沙箱自己沒回話時的保險
    thumbBox.contentWindow.postMessage({ id, js: r.js, loop, FRAMES: THUMB_FRAMES, FPS: THUMB_FPS, timeout: THUMB_TIMEOUT }, "*");
  });
  // 沙箱裡跑的是學員的程式，傳回來的東西不能信：只收「28 格、每格 N×N×3 個位元組」
  const N = out && out.ok === true && (out.N === 8 || out.N === 16) ? out.N : 0;
  if (!N || !Array.isArray(out.shots) || out.shots.length !== THUMB_FRAMES ||
      !out.shots.every((s) => s instanceof Uint8Array && s.length === N * N * 3)) return null;
  const cv = document.createElement("canvas");
  cv.width = N * THUMB_FRAMES;
  cv.height = N;
  const g = cv.getContext("2d"), img = g.createImageData(cv.width, N);
  out.shots.forEach((fb, i) => {
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
      const s = (y * N + x) * 3, d = (y * cv.width + i * N + x) * 4;
      img.data[d] = fb[s]; img.data[d + 1] = fb[s + 1]; img.data[d + 2] = fb[s + 2]; img.data[d + 3] = 255;
    }
  });
  g.putImageData(img, 0, 0);
  const url = cv.toDataURL("image/png");
  store.saveThumb(ex, cv, url);         // 存起來下次直接用（離線版上傳給編譯站，雲端版存在瀏覽器）
  return url;
}

function setCode(code, id) {
  pickSeq++;                   // 還在路上的「載入範例」作廢（例如點了範例又馬上匯入、開除錯模式）：晚到的不會蓋掉這次放進來的程式
  codeEl.value = code;
  loadedCode = codeEl.value;   // 用編輯區讀回來的內容比對：textarea 會把 CRLF 換成 LF（學員電腦用 git 取出的範例是 CRLF）
  currentId = id;
  for (const c of cardsEl.querySelectorAll(".card")) c.classList.toggle("on", c.dataset.id === id);
  renderExButtons();
  saveDraftSoon();
}

// ── 草稿（雲端版）：編輯區的程式隨時存一份在這個瀏覽器裡 ─────────────────────
// 雲端版的程式只在這個分頁裡：重新整理、不小心關掉分頁、電腦睡著被瀏覽器收掉，再開要還在。
// 存的是編輯區的程式、它是從哪個範例來的（卡片亮燈、有沒有改過都照舊）。開發版、離線版不做這件事（跟以前一樣開頁就載入第一個範例）。
const DRAFT_KEY = "babit.draft";
let draftTimer = null;
const writeDraft = () => { if (CLOUD) remember(DRAFT_KEY, JSON.stringify({ code: codeEl.value, loaded: loadedCode, id: currentId })); };
function saveDraftSoon() {
  if (!CLOUD) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(writeDraft, 400);
}
function readDraft() {
  try {
    const d = JSON.parse(stored(DRAFT_KEY) || "null");
    return d && typeof d.code === "string" && d.code.trim() ? d : null;
  } catch (_) { return null; }
}
// 分頁被收起來、關掉之前馬上存（不等那 0.4 秒）
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { clearTimeout(draftTimer); writeDraft(); } });
addEventListener("pagehide", () => { clearTimeout(draftTimer); writeDraft(); });

// 連點幾個範例時只有最後點的那個有用：前面點的比較晚才拿到程式（網路慢、電腦忙）也不會蓋掉後面點的
let pickSeq = 0;
async function pickExample(ex, force = false) {
  if (!force && isDirty() && !confirm("載入「" + ex.title + "」會蓋掉目前的程式碼，確定嗎？")) return;
  const seq = ++pickSeq;
  let code;
  try { code = await store.code(ex); }
  catch (e) {
    if (seq === pickSeq) statusEl.textContent = "載入範例失敗：" + e.message;
    return;
  }
  if (seq !== pickSeq) return;
  // 除錯模式開著時點了範例卡片：就是要看那個範例了，先離開除錯模式。不然「除錯模式」的燈還亮著、編輯區卻已經是範例，
  // 這時按燒錄燒進去的不是零件檢查（2026-11-24 實機踩到）。force＝程式自己載入的（開頁、切換尺寸），不算
  if (dbg.on && !force) { await setDebug(false); if (seq !== pickSeq) return; }
  setCode(code, ex.id);
  run();
}

// 載入目前尺寸的第一個範例；沒有範例（或連不上）就用內建的彩虹
async function loadFirstExample() {
  if (galleryList.length) await pickExample(galleryList[0], true);
  else { setCode(defaultCode(size), null); run(); }
}

function renderSize() {
  sz8.classList.toggle("on", size === 8);
  sz16.classList.toggle("on", size === 16);
}

// 切換＝換一組範例。編輯區是學員改過或貼上的程式就不碰它（不跳確認、不會丟程式），只更新範例庫與尺寸提醒；
// 編輯區還是原封不動的範例，才換成新尺寸的第一個範例。
async function switchSize(n) {
  if (n === size) return;
  const keep = isDirty();
  size = n;
  try { localStorage.setItem(SIZE_KEY, String(n)); } catch (_) {}
  renderSize();
  await loadGallery();
  if (keep) {
    state.panelWarn = panelWarnText(state.n);      // 最後一次執行的程式是哪一種燈板
    renderWarn();
    return;
  }
  // 除錯模式、編輯區是原封不動的零件檢查：換成新尺寸的零件檢查，不是換成範例
  // （不然「除錯模式」還亮著，按燒錄卻燒進彩虹流動，板子上看不到零件檢查，文字視窗也沒有東西）
  if (dbg.on && codeEl.value === dbg.code) { if (await loadCheckSketch()) run(); return; }
  await loadFirstExample();
}

// ── 新增範例：把編輯區的程式存到 examples/<尺寸>/我的範例/<名稱>.ino，縮圖由編譯站自動產生 ──
const addBtn = document.getElementById("addex"), addPanel = document.getElementById("addpanel");
const exName = document.getElementById("exname"), exErr = document.getElementById("exerr"), exNote = document.getElementById("exnote");
function toggleAddPanel(open) {
  addPanel.hidden = !open;
  addBtn.classList.toggle("on", open);
  exErr.hidden = true;
  if (open) {
    exNote.textContent = `會把上面編輯區的程式存到「${size}×${size}／我的範例」，名稱就是卡片上的標題，縮圖會自動產生。官方範例不會被改到。` +
      (CLOUD ? "範例存在這台電腦的這個瀏覽器裡：換電腦、換瀏覽器就看不到，要帶走請按「⬇ 匯出 Arduino 資料夾」。" : "");
    exName.focus();
  }
}
async function saveExample(overwrite = false) {
  const name = exName.value.trim();
  let s;
  try { s = await store.add({ size, name, code: codeEl.value, overwrite }); }
  catch (e) { exErr.textContent = "存檔失敗：" + e.message; exErr.hidden = false; return; }
  if (s.exists && !overwrite) {
    if (confirm(`「${name}」已經有了，要用目前的程式覆蓋嗎？`)) return saveExample(true);
    return;
  }
  if (!s.ok) { exErr.textContent = s.error || "存檔失敗"; exErr.hidden = false; return; }
  toggleAddPanel(false);
  loadedCode = codeEl.value;
  currentId = s.id;
  saveDraftSoon();
  await loadGallery();
  statusEl.textContent = `✓ 已存成範例「${name}」`;
}
addBtn.addEventListener("click", () => toggleAddPanel(addPanel.hidden));
document.getElementById("exsave").addEventListener("click", () => saveExample());
document.getElementById("excancel").addEventListener("click", () => toggleAddPanel(false));
exName.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); saveExample(); } });

// ── 改自己的範例：存回（覆蓋同一個檔）、刪除（先問；程式留在編輯區）。官方範例不能改，要改就另存成自己的 ──
async function updateExample() {
  const ex = currentExample();
  if (!ex || !ex.mine) return;
  let s;
  try { s = await store.update(ex, codeEl.value); }
  catch (e) { statusEl.textContent = "存回失敗：" + e.message; return; }
  if (!s.ok) { statusEl.textContent = "存回失敗：" + s.error; return; }
  loadedCode = codeEl.value;
  saveDraftSoon();
  await loadGallery();                       // 卡片縮圖換成新程式的
  statusEl.textContent = `✓ 已存回「${ex.title}」`;
}
async function deleteExample() {
  const ex = currentExample();
  if (!ex || !ex.mine) return;
  if (!confirm(`要刪除「${ex.title}」嗎？刪掉就找不回來（程式會留在編輯區）。`)) return;
  let s;
  try { s = await store.remove(ex); }
  catch (e) { statusEl.textContent = "刪除失敗：" + e.message; return; }
  if (!s.ok) { statusEl.textContent = "刪除失敗：" + s.error; return; }
  currentId = null;
  loadedCode = "";                           // 編輯區的程式不再對應任何範例：換範例時會先問，不會悄悄不見
  saveDraftSoon();
  await loadGallery();
  statusEl.textContent = `✓ 已刪除「${ex.title}」（程式還在編輯區，要的話按「＋ 新增範例」再存）`;
}
exUpdateBtn.addEventListener("click", updateExample);
exDeleteBtn.addEventListener("click", deleteExample);
codeEl.addEventListener("input", () => { renderExButtons(); saveDraftSoon(); });
// Ctrl+S（Mac：⌘+S）：自己的範例就存回；其他（官方範例、貼上的程式）打開「＋ 新增範例」
document.addEventListener("keydown", (e) => {
  if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== "s") return;
  e.preventDefault();
  const ex = currentExample();
  if (ex && ex.mine) { if (isDirty()) updateExample(); }
  else toggleAddPanel(true);
});

// ── 匯出 Arduino 資料夾、匯入 zip ─────────────────────────────────
// 匯出：編輯區的程式交給編譯站打包成 Arduino IDE 可以直接開的資料夾（zip：同名 .ino＋BatoPixel.h＋燈條函式庫＋說明），
// 學員不用 Babit 工具也能用 Arduino IDE 上傳。資料夾名稱只能用英數字（Arduino 的規定），所以自動編號：
// babit_月日_序號（這個瀏覽器當天第幾次匯出；成功才佔序號）。作品名稱（目前那張範例卡片的名稱）一起送給編譯站，
// 寫進資料夾裡的 README.txt，匯入時讀回來。
const EXPORT_SEQ_KEY = "babit.exportSeq";
function nextExportName() {
  const d = new Date(), day = String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  let n = 0;
  try { const s = JSON.parse(localStorage.getItem(EXPORT_SEQ_KEY) || "{}"); if (s && s.day === day) n = s.n | 0; } catch (_) {}
  return { day, n: n + 1, name: `babit_${day}_${String(n + 1).padStart(2, "0")}` };
}
async function exportArduino() {
  const next = nextExportName();
  // 作品名稱只在「編輯區的程式就是這張卡片」時才帶：自己的範例（改到一半也算），或原封不動的官方範例。
  // 在官方範例上改過、或整段貼上別的程式，那已經不是那個範例了：不帶名稱，匯入時改用程式第一行的註解
  const ex = currentExample();
  const title = ex && (ex.mine || !isDirty()) ? ex.title : "";
  let r;
  try {
    r = await api("/export/arduino?name=" + encodeURIComponent(next.name) + (title ? "&title=" + encodeURIComponent(title) : ""),
      { method: "POST", headers: { "Content-Type": "text/plain; charset=utf-8" }, body: codeEl.value });
  } catch (e) { statusEl.textContent = "匯出失敗：" + e.message; return; }
  if (!r.ok) {
    let j = {};
    try { j = await r.json(); } catch (_) {}
    statusEl.textContent = "匯出失敗：" + String(j.error || r.status).split("\n")[0];
    return;
  }
  const url = URL.createObjectURL(await r.blob());
  const a = document.createElement("a");
  a.href = url;
  a.download = next.name + ".zip";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  try { localStorage.setItem(EXPORT_SEQ_KEY, JSON.stringify({ day: next.day, n: next.n })); } catch (_) {}
  statusEl.textContent = `✓ 已匯出 ${next.name}.zip：解壓縮後用 Arduino IDE 打開裡面的 ${next.name}.ino（步驟寫在 README.txt）`;
}

// 匯入：編譯站從 zip 讀出程式、作品名稱、燈板尺寸，再存成「我的範例」。同名的已經有了就加編號，不覆蓋。
// 編輯區沒有還沒存的修改才載入並執行（必要時切換燈板尺寸）；有的話只放進範例庫，不動編輯區
const importFile = document.getElementById("eximportfile");
const IMPORT_MAX = 2 * 1024 * 1024;           // 跟編譯站 /import/arduino 的上限一樣；作品 zip 只有幾十 KB
const NAME_MAX = 40;                          // 範例名稱的上限（編譯站 catalog.js 的 validName）
async function importArduino(file) {
  // 太大的檔案不用送：編譯站收到一半就會切斷連線，學員只會看到看不懂的連線錯誤
  if (file.size > IMPORT_MAX) { statusEl.textContent = "匯入失敗：檔案太大（上限 2 MB），請選從 Babit 工具匯出的 zip"; return; }
  let j;
  try {
    const r = await api("/import/arduino", { method: "POST", headers: { "Content-Type": "application/zip" }, body: file });
    j = await r.json();
  } catch (e) { statusEl.textContent = "匯入失敗：" + e.message; return; }
  if (!j.ok) { statusEl.textContent = "匯入失敗：" + (j.error || "讀不懂這個檔案"); return; }
  let saved = null, name = j.title;
  for (let n = 1; n <= 30 && !saved; n++) {
    // 加編號前先把名稱截短，加完才不會超過名稱的上限；截短的地方剛好在表情符號中間就整個拿掉，不留半個
    const suffix = n === 1 ? "" : " " + n;
    name = j.title.slice(0, NAME_MAX - suffix.length).replace(/[\uD800-\uDBFF]$/, "").trimEnd() + suffix;
    let s;
    try { s = await store.add({ size: j.size, name, code: j.code }); }
    catch (e) { statusEl.textContent = "匯入失敗：" + e.message; return; }
    if (s.exists) continue;
    if (!s.ok) { statusEl.textContent = "匯入失敗：" + s.error; return; }
    saved = s;
  }
  if (!saved) { statusEl.textContent = `匯入失敗：「${j.title}」同名的範例太多了，請先刪掉幾個`; return; }
  const where = `${j.size}×${j.size}／我的範例`;
  if (isDirty()) {
    // 同一種尺寸：卡片就在下面的範例庫。另一種尺寸：卡片不在目前的範例庫，要切換過去才看得到（切換不會動編輯區改過的程式）
    if (j.size === size) await loadGallery();
    statusEl.textContent = `✓ 已匯入成範例「${name}」（${where}）。編輯區的程式還沒存，所以沒有動它；` +
      (j.size === size ? "要看就點那張卡片" : `切換到 ${j.size}×${j.size} 就看得到那張卡片（編輯區的程式會留著）`);
    return;
  }
  if (j.size !== size) {
    size = j.size;
    try { localStorage.setItem(SIZE_KEY, String(size)); } catch (_) {}
    renderSize();
  }
  await loadGallery();
  setCode(j.code, saved.id);
  await run();
  if (/^✓ 執行中/.test(statusEl.textContent)) statusEl.textContent = `✓ 已匯入成範例「${name}」（${where}），執行中`;
}
document.getElementById("exexport").addEventListener("click", exportArduino);
document.getElementById("eximport").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", () => {
  const f = importFile.files && importFile.files[0];
  importFile.value = "";                      // 同一個檔案可以再選一次
  if (f) importArduino(f);
});

// ── 複製給 AI 的說明（AGENTS.md）：學員貼到自己的 AI 對話框，AI 就知道程式要怎麼寫 ──
document.getElementById("aiguide").addEventListener("click", async () => {
  try {
    const r = await fetch("/ai-guide");
    if (!r.ok) throw new Error(r.status);
    await copyText(await r.text());
    statusEl.textContent = "✓ 已複製給 AI 的說明：貼到 AI 的對話框，再告訴它你想做什麼動畫";
  } catch (e) {
    statusEl.textContent = "複製失敗：" + e.message;
  }
});

// ── 開頁 ──────────────────────────────────────────────────────────
// 先問編譯站是哪個部署目標，再照目標準備：雲端版把自己的範例換成存在瀏覽器、檢查能不能燒錄、還原上次的草稿；
// 其他的連 Art-Net 橋。然後載入範例庫，載入第一個範例（或草稿）並執行：預覽直接出現畫面
renderSize();
(async () => {
  await loadVersion();
  let draft = null;
  if (CLOUD) {
    store = browserStore;
    draft = readDraft();
    if (!("serial" in navigator)) {
      state.browserWarn = "這個瀏覽器不能把程式燒進板子（預覽可以用）。要燒錄請用電腦上的 Chrome 或 Edge 開這個網址。";
      renderWarn();
    }
  } else artnetConnect();
  await loadGallery();
  if (!draft) { await loadFirstExample(); return; }
  codeEl.value = draft.code;
  loadedCode = typeof draft.loaded === "string" ? draft.loaded : "";
  currentId = typeof draft.id === "string" && galleryList.some((e) => e.id === draft.id) ? draft.id : null;
  for (const c of cardsEl.querySelectorAll(".card")) c.classList.toggle("on", c.dataset.id === currentId);
  renderExButtons();
  run();
})();

runBtn.addEventListener("click", run);
flashBtn.addEventListener("click", flash);
micBtn.addEventListener("click", useMic);
toneBtn.addEventListener("click", useTone);
sz8.addEventListener("click", () => switchSize(8));
sz16.addEventListener("click", () => switchSize(16));
document.getElementById("copylog").addEventListener("click", async () => {
  await copyText(logEl.textContent);
  statusEl.textContent = "✓ 已複製錯誤訊息：貼到 AI 的對話框，請它修正";
});
window.__bpRun = run;
window.__bpTone = useTone;
codeEl.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
});
</script>
